# Solar plant Lovelace (YAML). Plug tiles use HACS button-card and auto-entities.
# https://www.home-assistant.io/dashboards/dashboards/#adding-yaml-dashboards
# https://www.home-assistant.io/dashboards/sections/
title: Solar plant
button_card_templates:
  plug_socket:
    show_name: true
    show_label: true
    show_state: false
    section_mode: true
    size: 28px
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    # The label reads helpers and the socket's hold timer by built-up ids, which
    # button-card cannot detect, so re-render on any change (hold starts just after
    # the switch changes).
    triggers_update: all
    name: |
      [[[
        const id = entity.entity_id.replace("switch.ihoment_plug_", "");
        const load = states["input_text.plug_" + id + "_load"];
        const text = load && load.state && load.state !== "unknown" && load.state !== "unavailable" ? load.state : "";
        return text || id.replace("_", " ").toUpperCase();
      ]]]
    label: |
      [[[
        const id = entity.entity_id.replace("switch.ihoment_plug_", "");
        const plug = id.split("_")[0];
        const where = states["input_text.plug_" + plug + "_location"];
        const use = states["input_select.plug_" + id + "_use"];
        const place = where && where.state && where.state !== "unknown" && where.state !== "unavailable" && where.state !== "" ? where.state : plug.toUpperCase();
        const inv = states["input_select.plug_" + id + "_inverter"];
        const role = inv && inv.state === "House" ? "house" : (use && use.state === "dump" ? "dump" : (use && use.state === "Sungold charge" ? "charge" : "normal"));
        const heard = states["sensor.plug_" + plug + "_heard_by"];
        const radio = heard && heard.state && heard.state !== "unknown" && heard.state !== "unavailable" && heard.state !== "none" ? heard.state.split(" ")[0] : "";
        const hold = states["timer.plug_" + id + "_hold"];
        let held = "";
        if (hold && hold.state === "active" && hold.attributes.finishes_at) {
          const end = new Date(hold.attributes.finishes_at);
          held = " · hold to " + String(end.getHours()).padStart(2, "0") + ":" + String(end.getMinutes()).padStart(2, "0");
        } else if (hold && hold.state === "paused") {
          held = " · hold paused";
        }
        return place + " · " + role + held + (radio ? " · " + radio : "");
      ]]]
    state:
      - value: "on"
        icon: mdi:power-plug
        color: "#3dd68c"
      - value: "off"
        icon: mdi:power-plug-off
        color: "#8b98a5"
    styles:
      card:
        - border-radius: 12px
        - padding: 8px
        - border: |
            [[[
              const id = entity.entity_id.replace("switch.ihoment_plug_", "");
              const use = states["input_select.plug_" + id + "_use"];
              const inv = states["input_select.plug_" + id + "_inverter"];
              const dump = use && use.state === "dump" && !(inv && inv.state === "House");
              const charge = use && use.state === "Sungold charge" && inv && (inv.state === "A" || inv.state === "B");
              if (charge) return "2px solid #3d8bfd";
              return dump ? "2px solid #c9a227" : "1px solid var(--divider-color)";
            ]]]
      name:
        - font-size: 14px
        - font-weight: bold
      label:
        - font-size: 12px
views:
  - title: Now
    path: now
    type: sections
    max_columns: 3
    dense_section_placement: false
    header:
      layout: responsive
      badges_position: bottom
      card:
        type: markdown
        title: Solar plant
        content: >
          One tile per **device sensor** (each entity appears once on this view).
          Victron BLE, Sungold Modbus, meter-1. Dump helpers live under **Dump** sections.
          **power-sankey** uses Energy dashboard config only.
    badges:
      - type: entity
        entity: sensor.battery_1_state_of_charge
        name: A SoC
        show_name: true
      - type: entity
        entity: sensor.battery_2_state_of_charge
        name: B SoC
        show_name: true
      - type: entity
        entity: sensor.sungold-inverter-1_battery_soc
        name: Sungold SoC
        show_name: true
      - type: entity
        entity: sensor.nws_example_alerts
        name: NWS
        show_name: true
    sections:
      - type: grid
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.dump_unhold_for_next
                state: "on"
            card:
              type: markdown
              title: Do this
              show_empty: false
              entity_id: binary_sensor.dump_unhold_for_next
              content: |
                {% set body = state_attr('binary_sensor.dump_unhold_for_next', 'actions') %}
                {% if body %}{{ body }}{% endif %}
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.dump_unhold_for_next
                state: "on"
            card:
              type: tile
              entity: binary_sensor.dump_unhold_for_next
              name: Un-hold next socket
              icon: mdi:alert
              color: amber
              tap_action:
                action: more-info
              icon_tap_action:
                action: more-info
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.dump_status_pv_falling
                state: "on"
            card:
              type: tile
              entity: binary_sensor.dump_status_pv_falling
              name: PV falling
              icon: mdi:alert
              color: amber
              tap_action:
                action: more-info
              icon_tap_action:
                action: more-info
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.dump_load_exceeds_solar
                state: "on"
            card:
              type: tile
              entity: binary_sensor.dump_load_exceeds_solar
              name: Sungold load
              icon: mdi:alert
              color: amber
              tap_action:
                action: more-info
              icon_tap_action:
                action: more-info
            grid_options:
              columns: full
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.dump_inverter-1-vguard
                state: "on"
            card:
              type: tile
              entity: binary_sensor.dump_inverter-1-vguard
              name: Sungold guard
              icon: mdi:alert
              color: amber
              tap_action:
                action: more-info
              icon_tap_action:
                action: more-info
            grid_options:
              columns: full
          - type: heading
            heading: Power flow
          - type: power-sankey
            title: Power flow
            layout: auto
            collection_key: energy_dashboard
            group_by_area: false
            group_by_floor: false
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: A 24 V
          - type: tile
            entity: sensor.battery_1_power
            name: A W
          - type: tile
            entity: sensor.battery_1_voltage
            name: A V
          - type: tile
            entity: sensor.battery_1_current
            name: A A
          - type: tile
            entity: sensor.battery-2-ah_balance_words
            name: A Ah removed
            name: Consumed Ah
          - type: tile
