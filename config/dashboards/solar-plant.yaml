            name: A time remaining
            name: Remaining min
          - type: tile
            entity: sensor.battery_1_rssi
            name: RSSI

      - type: grid
        cards:
          - type: heading
            heading: B 24 V
          - type: tile
            entity: sensor.victron-mppt-1_solar_power
            name: 100/50 W
          - type: tile
            entity: sensor.victron-mppt-1_battery_state
            name: 100/50 charge
          - type: tile
            entity: sensor.victron-mppt-1_battery_power
            name: 100/50 charge W
          - type: tile
            entity: sensor.victron-mppt-1_solar_yield
            name: 100/50 yield
          - type: tile
            entity: sensor.victron-mppt-1_battery_voltage
            name: 100/50 V
          - type: tile
