      - type: grid
        cards:
          - type: heading
            heading: Socket Use (normal / dump / charge)
            icon: mdi:toggle-switch
          - type: markdown
            content: |
              Decides which sockets HA may switch by itself: **dump** = the dump rules may turn it on and off, **Sungold charge** = the charge rule may feed the inlet from the bank named by Inverter, **normal** = HA never touches it.
              Sungold charge is not a dump. Dump add, shed, off, on-demand and the voltage-guard shed skip it. Set Inverter to the feeding bank (A or B).
              Safe start: everything normal. Choose Sungold charge only for the inlet socket, after the Sungold panel allows mains charging.
              [Help: Socket Use (normal / dump / charge)](https://github.com/example/victron-ble2mqtt-integration/blob/main/docs/site-solar/socket-use.md)
            grid_options:
              columns: full
          - type: custom:auto-entities
            card:
              type: entities
              title: Socket Use
              show_header_toggle: false
              state_color: true
            filter:
              template: |-
                {%- macro sock_name(s) -%}{%- set b = ['', 'unknown', 'unavailable', 'none'] -%}{%- set p = s[:4] -%}{%- set tag = p | upper ~ ' ' ~ s[5:] -%}{%- set l = states('input_text.plug_' ~ s ~ '_load') | trim -%}{%- set w = states('input_text.plug_' ~ p ~ '_location') | trim -%}{{ (l ~ ' (' ~ tag ~ ')') if l not in b else tag }}{{ (' at ' ~ w) if w not in b else '' }}{%- endmacro -%}
                [
                {%- for e in [
                  'input_select.plug-1_left_use', 'input_select.plug-1_right_use',
                  'input_select.plug-2_left_use', 'input_select.plug-2_right_use',
                  'input_select.plug-3_left_use', 'input_select.plug-3_right_use',
                  'input_select.plug-4_left_use', 'input_select.plug-4_right_use',
                  'input_select.plug-5_left_use', 'input_select.plug-5_right_use',
                  'input_select.plug-6_left_use', 'input_select.plug-6_right_use',
                  'input_select.plug-7_left_use', 'input_select.plug-7_right_use',
                  'input_select.plug-8_left_use', 'input_select.plug-8_right_use',
                ] -%}
                {%- set s = e.split('.')[1][6:].rsplit('_', 1)[0] -%}
                {{ {'entity': e, 'name': sock_name(s)} | tojson }}{{ ',' if not loop.last else '' }}
                {%- endfor -%}
                ]
            show_empty: true
            grid_options:
              columns: full

      - type: grid
        cards:
          - type: heading
            heading: Socket inverter (bus)
            icon: mdi:car-battery
          - type: markdown
            content: |
              **House** marks a plug on house grid power: dump control never switches it. Sungold, A, and B are the label and the Sungold charge source bank. Dump on and off follow the measured bus meters, not this label.
              Set House only when the plug is on grid power. A stale Sungold, A, or B label does not keep a socket on while another bus is in trouble.
              Sungold charge still reads Inverter as the bank that feeds the inlet (A or B). A brand-new socket starts on Sungold.
              [Help: Socket inverter (bus)](https://github.com/example/victron-ble2mqtt-integration/blob/main/docs/site-solar/socket-inverter.md)
            grid_options:
              columns: full
          - type: custom:auto-entities
            card:
              type: entities
              title: Socket inverter
              show_header_toggle: false
              state_color: true
            filter:
              template: |-
                {%- macro sock_name(s) -%}{%- set b = ['', 'unknown', 'unavailable', 'none'] -%}{%- set p = s[:4] -%}{%- set tag = p | upper ~ ' ' ~ s[5:] -%}{%- set l = states('input_text.plug_' ~ s ~ '_load') | trim -%}{%- set w = states('input_text.plug_' ~ p ~ '_location') | trim -%}{{ (l ~ ' (' ~ tag ~ ')') if l not in b else tag }}{{ (' at ' ~ w) if w not in b else '' }}{%- endmacro -%}
                [
                {%- for e in [
                  'input_select.plug-1_left_inverter', 'input_select.plug-1_right_inverter',
