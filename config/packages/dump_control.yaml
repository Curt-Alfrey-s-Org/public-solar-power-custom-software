              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% set bus = states('input_select.plug_' ~ s ~ '_inverter') %}
              {% set low = is_state('binary_sensor.dump_v_rebulk_t2', 'on') if bus == 'T2' else (is_state('binary_sensor.dump_v_rebulk_ku', 'on') if bus == 'KU' else false) %}
              {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
                 and (bus == 'T2' or bus == 'KU')
                 and is_state('switch.ihoment_plug_' ~ s, 'on')
                 and (states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on'))
                 and low %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ is_state('switch.ihoment_plug_' ~ repeat.item, 'on') }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ not is_state('input_boolean.plug_' ~ repeat.item ~ '_held_by_you', 'on') }}"
                  then:
                  - event: dump_control_switching
                    event_data:
                      sock: "{{ repeat.item }}"
                      state: "off"
                  - action: switch.turn_off
                    target:
                      entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                - action: timer.cancel
                  target:
                    entity_id: "timer.plug_{{ repeat.item }}_min_on"
                - action: timer.start
                  target:
                    entity_id: "timer.plug_{{ repeat.item }}_cooldown"
                - variables:
                    sock: "{{ repeat.item }}"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                    message: >-
                      {{ label }}: turned OFF by "Dump OFF Sungold charge sockets: feeding bank low": T2 {{ states('sensor.battery_1_voltage') }} V, KU {{ states('sensor.battery_2_voltage') }} V, re-bulk stop. Cooldown 10 min.

  - id: dump_inverter-1-charge_inlet_dark
    alias: "Dump ALERT Sungold charge: inlet has no power"
    description: >
      A socket whose Use is Sungold charge has been on for 3 minutes while the
      Sungold sidecar reports numbers, grid voltage is at or below 0, and charging
      power stays at or below 5 W. Grid voltage that is present does not alert:
      Sungold is waiting on its own charge settings. Missing sidecar values do not
      alert. Posts one notification and a phone text when the alert service is set.
      Does not turn the socket off. Home Assistant start re-checks an inlet that
      is already dark.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.inverter-1-charge_inlet_dark
        to: "on"
        for: "00:03:00"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.inverter-1-charge_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.inverter-1-charge_inlet_dark
        state: "on"
        for: "00:03:00"
    actions:
      - variables:
          msg: >-
            A Sungold charge socket is on, but Sungold grid voltage is
            {{ states('sensor.sungold-inverter-1_grid_voltage') }} V and charging power is
            {{ states('sensor.sungold-inverter-1_charging_power') }} W after 3 minutes.
            The inlet is not energized.
          svc: "{{ states('input_text.dump_notify_service') | trim }}"
      - action: notify.persistent_notification
        data:
          title: Sungold charge inlet has no power
          message: "{{ msg }}"
          notification_id: sungold_charge_inlet_dark
      - if:
          - condition: template
            value_template: "{{ svc not in ['persistent_notification', '', 'unknown', 'unavailable', 'none'] }}"
        then:
          - action: "notify.{{ svc }}"
            data:
              title: Sungold charge inlet has no power
              message: "{{ msg }}"

  - id: dump_inverter-1-charge_inlet_clear
    alias: "Dump ALERT Sungold charge: inlet dark cleared"
    description: >
      Dismisses the inlet-dark notification when grid voltage is no longer the
      no-power case. Does not switch the socket.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.inverter-1-charge_inlet_dark
        to: "off"
    actions:
      - action: persistent_notification.dismiss
        data:
          notification_id: sungold_charge_inlet_dark

  - id: plug_plugs_unseen_notify
    alias: "H5082 plugs not seen"
    description: >
      One persistent notification when any watched H5082 switch is unavailable
      or unknown. notification_id plug_plugs_unseen replaces the previous
      popup. Dismiss that id when every watched plug is on or off again.
      No time pattern. See docs/site-solar/dump-status.md.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id: binary_sensor.plug_plugs_unseen
        to: "on"
      - trigger: state
        entity_id: binary_sensor.plug_plugs_unseen
        to: "off"
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.plug_plugs_unseen
                state: "on"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: plug_plugs_unseen
                  title: Plug not seen
                  message: >
                    Home Assistant is not receiving
                    {{ state_attr('binary_sensor.plug_plugs_unseen', 'entity_ids') }}.
        default:
          - action: persistent_notification.dismiss
            data:
              notification_id: plug_plugs_unseen

  - id: dump_hold_start
    alias: "Dump HOLD start: dump socket switched by hand"
    description: >
      A dump socket (Use dump, Inverter not House) or a Sungold charge socket (Inverter
      T2 or KU) turned on or off and dump control did not ask for it: a Plugs button tap,
      the plug's own button, another automation or an app. Starts that socket's hold timer
      for "Dump manual hold" minutes (0 = off) so the automatic rules leave it alone, and
      logs it. A change that matches a dump control request from the last 3 minutes
      (sensor.dump_control_switching) is not a hand switch. Runs even while the master
      switch is off, so turning it on later does not undo you.
    mode: queued
    max: 32
    triggers:
      - trigger: state
        entity_id:
          - switch.plug-1_left
          - switch.plug-1_right
          - switch.plug-2_left
          - switch.plug-2_right
          - switch.plug-3_left
          - switch.plug-3_right
          - switch.plug-4_left
          - switch.plug-4_right
          - switch.plug-5_left
          - switch.plug-5_right
          - switch.plug-6_left
          - switch.plug-6_right
          - switch.plug-7_left
          - switch.plug-7_right
          - switch.plug-8_left
          - switch.plug-8_right
        from:
          - "on"
          - "off"
        to:
          - "on"
          - "off"
    variables:
      sock: "{{ trigger.entity_id | replace('switch.ihoment_plug_', '') }}"
      hold_min: "{{ states('input_number.dump_manual_hold_min') | int(0) }}"
      by_dump: >-
        {%- set reqs = state_attr('sensor.dump_control_switching', 'intents') -%}
        {%- set i = reqs.get(sock) if reqs is mapping else none -%}
        {{ i is not none and i[0] == trigger.to_state.state
           and (as_timestamp(now()) - (i[1] | float(0))) < 180 }}
    actions:
      - if:
          - condition: template
            value_template: "{{ by_dump }}"
        then:
          # Dump control's own change: use the request up so a later hand switch to
          # the same state inside the 3 minutes still counts as a hand switch.
          - event: dump_control_switching
            event_data:
              sock: "{{ sock }}"
              state: "done"
          - stop: dump control asked for this change
      - condition: template
        value_template: "{{ ((is_state('input_select.plug_' ~ sock ~ '_use', 'dump') and not is_state('input_select.plug_' ~ sock ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ sock.split('_')[0] ~ '_online', 'on')) or (is_state('input_select.plug_' ~ sock ~ '_use', 'Sungold charge') and (is_state('input_select.plug_' ~ sock ~ '_inverter', 'T2') or is_state('input_select.plug_' ~ sock ~ '_inverter', 'KU')))) and hold_min > 0 }}"
      - action: timer.start
        target:
          entity_id: "timer.plug_{{ sock }}_hold"
        data:
          duration: "{{ '%02d:%02d:00' % (hold_min // 60, hold_min % 60) }}"
      - *socket_label
      - action: logbook.log
        data:
          name: Dump control
          entity_id: "{{ trigger.entity_id }}"
          message: >-
            {{ label }}: switched {{ trigger.to_state.state | upper }} by hand (Plugs button, the
            plug's own button, Turn next dump ON, Turn dumps OFF, or another app), not by an
            automatic dump or Sungold charge rule. Hold {{ hold_min }} min: those rules leave it alone until
            {{ (now() + timedelta(minutes=hold_min)).strftime('%H:%M') }}.

  - id: dump_hold_end
    alias: "Dump HOLD end: automatic control resumes"
    description: >
      A socket's manual hold timer went back to idle (time up, or cleared with Clear all
      holds or the timer's Cancel). Logs it. The dump turn-off rules only fire when their
      condition starts, so if the master switch is on and this dump socket is still on
      while dump control would want it off right now (solar gone, T2 charger left
      absorption/float, Sungold load above solar, the Sungold voltage guard, its bus at
      stop volts or its battery past the limit), it is turned off with a cooldown.
      A Sungold charge socket is turned off here only when charge control is enabled and
      rescue is off and the feeding bank is not in surplus, or its feeding bank is under
      the source stop helper. A surplus charge that still qualifies is left on.
      Dump reasons such as solar gone do not turn a Sungold charge socket off.
      Turning a dump socket on resumes by itself through sensor.dump_next_plug.
    mode: queued
    max: 32
    triggers:
      - trigger: state
        entity_id:
          - timer.plug-1_left_hold
          - timer.plug-1_right_hold
          - timer.plug-2_left_hold
          - timer.plug-2_right_hold
          - timer.plug-3_left_hold
          - timer.plug-3_right_hold
          - timer.plug-4_left_hold
          - timer.plug-4_right_hold
          - timer.plug-5_left_hold
          - timer.plug-5_right_hold
          - timer.plug-6_left_hold
          - timer.plug-6_right_hold
          - timer.plug-7_left_hold
          - timer.plug-7_right_hold
          - timer.plug-8_left_hold
          - timer.plug-8_right_hold
        from: "active"
        to: "idle"
    variables:
      sock: "{{ trigger.entity_id | replace('timer.plug_', '') | replace('_hold', '') }}"
      target: "{{ 'switch.ihoment_plug_' ~ sock }}"
      bus: "{{ states('input_select.plug_' ~ sock ~ '_inverter') }}"
      time_up: >-
        {{ as_timestamp(trigger.from_state.attributes.get('finishes_at'), 0) <= as_timestamp(now()) + 5 }}
      why_off: >-
        {%- if not is_state('binary_sensor.dump_solar_present', 'on') -%}solar gone
        {%- elif not is_state('binary_sensor.dump_charge_ok', 'on') -%}T2 charger left absorption/float
        {%- elif is_state('binary_sensor.dump_load_exceeds_solar', 'on') -%}Sungold load above solar
        {%- elif is_state('binary_sensor.dump_v_rebulk_t2', 'on') -%}T2 bus at stop volts
        {%- elif is_state('binary_sensor.dump_v_rebulk_ku', 'on') -%}KU bus at stop volts
        {%- elif is_state('binary_sensor.dump_v_rebulk_sph', 'on') -%}Sungold bus at stop volts
        {%- elif not is_state('binary_sensor.dump_batt_battery-2-ok', 'on') -%}T2 battery past its discharge limit
        {%- elif not is_state('binary_sensor.dump_batt_battery-1-ok', 'on') -%}KU battery past its discharge limit
        {%- elif not is_state('binary_sensor.dump_batt_inverter-1-ok', 'on') -%}Sungold battery past its discharge limit
        {%- elif is_state('binary_sensor.dump_inverter-1-vguard', 'on') -%}Sungold voltage guard
        {%- endif -%}
    actions:
      - *socket_label
      - action: logbook.log
        data:
          name: Dump control
          entity_id: "{{ target }}"
          message: >-
            {{ label }}: hold ended ({{ 'time up' if time_up else 'cleared' }}); automatic rules may
            switch it again.
      - if:
          - condition: state
            entity_id: input_boolean.dump_control_enabled
            state: "on"
          - condition: template
            value_template: "{{ (is_state('input_select.plug_' ~ sock ~ '_use', 'dump') and not is_state('input_select.plug_' ~ sock ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ sock.split('_')[0] ~ '_online', 'on')) and is_state(target, 'on') and why_off != '' }}"
        then:
          - if:
              - condition: template
                value_template: "{{ not is_state('input_boolean.plug_' ~ sock ~ '_held_by_you', 'on') }}"
            then:
            - event: dump_control_switching
              event_data:
                sock: "{{ sock }}"
                state: "off"
            - action: switch.turn_off
              target:
                entity_id: "{{ target }}"
          - action: timer.cancel
            target:
              entity_id: "timer.plug_{{ sock }}_min_on"
          - action: timer.start
            target:
              entity_id: "timer.plug_{{ sock }}_cooldown"
          - action: logbook.log
            data:
              name: Dump control
              entity_id: "{{ target }}"
              message: >-
                {{ label }}: turned OFF by "Dump HOLD end: automatic control resumes": the hold ended
                while {{ why_off }}. Cooldown 10 min.
      - if:
          - condition: state
            entity_id: input_boolean.inverter-1-charge_enabled
            state: "on"
          - condition: template
            value_template: >-
              {% set source_low = (bus == 'T2' and is_state('binary_sensor.dump_v_rebulk_t2', 'on'))
                 or (bus == 'KU' and is_state('binary_sensor.dump_v_rebulk_ku', 'on')) %}
              {% set bank_ok = (bus == 'T2' and is_state('binary_sensor.dump_battery-2-charger_float', 'on') and not is_state('binary_sensor.dump_v_rebulk_t2', 'on'))
                 or (bus == 'KU' and is_state('binary_sensor.dump_battery-1-charger_float', 'on') and not is_state('binary_sensor.dump_v_rebulk_ku', 'on')) %}
              {{ is_state('input_select.plug_' ~ sock ~ '_use', 'Sungold charge')
                 and (bus == 'T2' or bus == 'KU')
                 and is_state(target, 'on')
                 and (source_low or (not is_state('binary_sensor.inverter-1-charge_need', 'on') and not bank_ok)) }}
        then:
          - if:
              - condition: template
                value_template: "{{ not is_state('input_boolean.plug_' ~ sock ~ '_held_by_you', 'on') }}"
            then:
            - event: dump_control_switching
              event_data:
                sock: "{{ sock }}"
                state: "off"
            - action: switch.turn_off
              target:
                entity_id: "{{ target }}"
          - action: timer.cancel
            target:
              entity_id: "timer.plug_{{ sock }}_min_on"
          - action: timer.start
            target:
              entity_id: "timer.plug_{{ sock }}_cooldown"
          - action: logbook.log
            data:
              name: Dump control
              entity_id: "{{ target }}"
              message: >-
                {{ label }}: turned OFF by "Dump HOLD end: automatic control resumes": the hold ended
                while Sungold charge wanted the socket off. Cooldown 10 min.

# Manual only. Nothing in this repo calls it: no automation, no startup hook, no timer.
# The Site solar button asks for confirmation first. It writes the recommended starting
# values from docs/site-solar/*.md into the dump number helpers and turns
# "Dump ignore SoC" and "Dump hold also blocks turn-offs" on. It does NOT touch the master switch, the notify service, any
# socket Use / Inverter / label, or any switch.
script:
  dump_load_recommended_defaults:
    alias: "Dump settings: load recommended starting values"
    description: >
      Manual button. Replaces the dump volt, watt, SoC and confirm numbers with the
      recommended starting values (27.0 V start / 26.8 V stop on every bus, 2000 W AC
      limits, 0/0/50 W battery discharge, 50 W min solar, 90 % min SoC, no trip above 91 %, trip floor 90 %, 5 s, 25 W, 60 min
      manual hold, Sungold voltage guard floor 25.6 V, margin 0.30 V, hysteresis 0.10 V,
      dwell 60 s) and turns Dump hold also blocks turn-offs on. It leaves Dump
      ignore SoC as it is. It does not turn the voltage guard on, does not touch skip cooldown, and does not
      change the Sungold inlet charge numbers or its enable control. It also sets Victron absorption to 28.4 V and float to 27.0 V so T2 and KU follow that float. Use once on
      a fresh install, or to undo bad tuning.
    icon: mdi:backup-restore
    mode: single
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.victron_absorption_v
        data:
          value: 28.4
      - action: input_number.set_value
        target:
          entity_id: input_number.victron_float_v
        data:
          value: 27.0
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_float_battery-2-v
            - input_number.dump_float_battery-1-v
            - input_number.dump_float_inverter-1-v
        data:
          value: 27.0
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_rebulk_battery-2-v
            - input_number.dump_rebulk_battery-1-v
            - input_number.dump_rebulk_inverter-1-v
        data:
          value: 26.8
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_ac_limit_battery-2-w
            - input_number.dump_ac_limit_battery-1-w
            - input_number.dump_ac_limit_inverter-1-w
        data:
          value: 2000
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_max_discharge_battery-2-w
            - input_number.dump_max_discharge_battery-1-w
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_max_discharge_inverter-1-w
        data:
          value: 50
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_min_solar_w
        data:
          value: 50
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_min_soc_percent
        data:
          value: 90
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_soc_no_trip_percent
        data:
          value: 91
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_soc_trip_floor_percent
        data:
          value: 90
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_site_confirm_s
        data:
          value: 5
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_site_delta_min_w
        data:
          value: 25
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_manual_hold_min
        data:
          value: 60
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_inverter-1-vguard_floor_v
        data:
          value: 25.6
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_inverter-1-vguard_margin_v
        data:
          value: 0.3
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_inverter-1-vguard_hysteresis_v
        data:
          value: 0.1
      - action: input_number.set_value
        target:
          entity_id: input_number.dump_inverter-1-vguard_dwell_s
        data:
          value: 60
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.dump_hold_blocks_turn_off
      - action: logbook.log
        data:
          name: Dump control
          entity_id: script.dump_load_recommended_defaults
          message: >-
            loaded the recommended starting values into the dump settings, including
            the Sungold voltage guard numbers, and left the guard switch off (someone
            pressed the button).

  dump_clear_holds:
    alias: "Dump hold: clear all manual holds"
    description: >
      Manual button. Cancels every socket's manual hold timer, so the dump rules may
      switch those sockets again right away ("Dump HOLD end" logs each one).
    icon: mdi:hand-back-right-off
    mode: single
    sequence:
      - action: timer.cancel
        target:
          entity_id:
            - timer.plug-1_left_hold
            - timer.plug-1_right_hold
            - timer.plug-2_left_hold
            - timer.plug-2_right_hold
            - timer.plug-3_left_hold
            - timer.plug-3_right_hold
            - timer.plug-4_left_hold
            - timer.plug-4_right_hold
            - timer.plug-5_left_hold
            - timer.plug-5_right_hold
            - timer.plug-6_left_hold
            - timer.plug-6_right_hold
            - timer.plug-7_left_hold
            - timer.plug-7_right_hold
            - timer.plug-8_left_hold
            - timer.plug-8_right_hold
      - action: logbook.log
        data:
          name: Dump control
          entity_id: script.dump_clear_holds
          message: >-
            cleared every manual hold (someone pressed Clear all holds).

  dump_force_on:
    alias: "Dump on demand: turn next dump socket on"
    description: >
      Manual button. Turns on the one socket named by sensor.dump_ondemand_on (Use
      dump, Inverter not House, plug online, off, not on hold, cooldown idle unless skip cooldown
      is on). The inverter label does not skip a socket while the voltage guard is on. Does not fire
      dump_control_switching, so when the plug reports on, Dump HOLD start arms the
      manual hold. Cancels that socket's cooldown after it reports on. If skip
      cooldown was on, turns that switch off. Does nothing when the sensor is none.
    icon: mdi:power-plug
    mode: single
    sequence:
      - variables:
          target: "{{ states('sensor.dump_ondemand_on') }}"
          sock: "{{ states('sensor.dump_ondemand_on') | replace('switch.ihoment_plug_', '') }}"
          skip: "{{ is_state('input_boolean.dump_skip_cooldown', 'on') }}"
      - condition: template
        value_template: "{{ target is string and target.startswith('switch.ihoment_plug_') }}"
      - *socket_label
      - action: logbook.log
        data:
          name: Dump control
          entity_id: "{{ target }}"
          message: >-
            {{ label }}: Turn next dump ON pressed. Asking the socket to turn on.
            Manual hold starts when the plug reports the new state, if Dump manual hold
            is above 0.
      - if:
          - condition: template
            value_template: "{{ not is_state('input_boolean.plug_' ~ sock ~ '_held_by_you', 'on') }}"
        then:
        - action: switch.turn_on
          target:
            entity_id: "{{ target }}"
      - wait_template: "{{ is_state(target, 'on') }}"
        timeout: "00:02:00"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.completed }}"
        then:
          - action: timer.cancel
            target:
              entity_id: "timer.plug_{{ sock }}_cooldown"
          - if:
              - condition: template
                value_template: "{{ skip in [true, 'True', 'true'] }}"
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.dump_skip_cooldown
          - action: logbook.log
            data:
              name: Dump control
              entity_id: "{{ target }}"
              message: >-
                {{ label }}: plug reported on after Turn next dump ON.
                {% if skip in [true, 'True', 'true'] %}Skip cooldown was on and is now off.{% endif %}
        else:
          - action: logbook.log
            data:
              name: Dump control
              entity_id: "{{ target }}"
              message: >-
                {{ label }}: Turn next dump ON: plug did not report on within 2 min.
                Skip cooldown was left as it was. No hold from this press.

  dump_force_off:
    alias: "Dump on demand: turn dump sockets off"
    description: >
      Manual button. Turns off every dump socket that sensor.dump_ondemand_off lists
      (on, Use dump, Inverter not House, not on hold). Does not fire
      dump_control_switching, so when each plug reports off, Dump HOLD start arms that
      socket's manual hold. Starts each socket's cooldown unless skip cooldown was on,
      in which case those cooldowns are cancelled and the skip switch turns off after
      the first plug that reports off. Sockets already on hold are left alone.
    icon: mdi:power-plug-off
    mode: single
    sequence:
      - variables:
          skip: "{{ is_state('input_boolean.dump_skip_cooldown', 'on') }}"
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% if (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on')) and states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused']
                 and is_state('switch.ihoment_plug_' ~ s, 'on') %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - condition: template
        value_template: "{{ (targets | string | trim) not in ['[]', '', 'None', 'none'] }}"
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - variables:
                sock: "{{ repeat.item }}"
            - *socket_label
            - action: logbook.log
              data:
                name: Dump control
                entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                message: >-
                  {{ label }}: Turn dumps OFF pressed. Asking the socket to turn off.
                  Manual hold starts when the plug reports off, if Dump manual hold is above 0.
            - if:
                - condition: template
                  value_template: "{{ not is_state('input_boolean.plug_' ~ repeat.item ~ '_held_by_you', 'on') }}"
              then:
              - action: switch.turn_off
                target:
                  entity_id: "switch.ihoment_plug_{{ repeat.item }}"
            - wait_template: "{{ is_state('switch.ihoment_plug_' ~ repeat.item, 'off') }}"
              timeout: "00:02:00"
              continue_on_timeout: true
            - if:
                - condition: template
                  value_template: "{{ wait.completed }}"
              then:
                - action: timer.cancel
                  target:
                    entity_id: "timer.plug_{{ repeat.item }}_min_on"
                - if:
                    - condition: template
                      value_template: "{{ skip in [true, 'True', 'true'] }}"
                  then:
                    - action: timer.cancel
                      target:
                        entity_id: "timer.plug_{{ repeat.item }}_cooldown"
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.dump_skip_cooldown
                  else:
                    - action: timer.start
                      target:
                        entity_id: "timer.plug_{{ repeat.item }}_cooldown"
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                    message: >-
                      {{ label }}: plug reported off after Turn dumps OFF.
                      {% if skip in [true, 'True', 'true'] %}Skip cooldown was on: no cooldown, and the skip switch is off.{% else %}Cooldown 10 min.{% endif %}
              else:
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                    message: >-
                      {{ label }}: Turn dumps OFF: plug did not report off within 2 min.
                      Cooldown and skip cooldown were left as they were.

