  - id: dump_inverter-1-vguard_shed
    alias: "Dump OFF Sungold sockets: Sungold voltage guard"
    description: >
      Sungold battery voltage has stayed under the guard floor or under the lower of
      the live T2 and KU shunt voltages by the guard margin, for the guard dwell
      helper. Does not post a status notification. When the master switch is on, turns off
      every dump socket that is not already off (the inverter label is not the filter),
      unless a manual hold blocks turn-offs. Does not write Sungold inverter settings.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.dump_inverter-1-vguard
        to: "on"
        for:
          seconds: "{{ states('input_number.dump_inverter-1-vguard_dwell_s') | int(0) }}"
      - trigger: state
        entity_id: input_boolean.dump_control_enabled
        to: "on"
    conditions:
      - condition: state
        entity_id: binary_sensor.dump_inverter-1-vguard
        state: "on"
        for:
          seconds: "{{ states('input_number.dump_inverter-1-vguard_dwell_s') | int(0) }}"
    actions:
      - variables:
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% if (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on')) and (states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on'))
                 and not is_state('switch.ihoment_plug_' ~ s, 'off') %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - if:
          - condition: state
            entity_id: input_boolean.dump_control_enabled
            state: "on"
        then:
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ not is_state('input_boolean.plug_' ~ repeat.item ~ '_held_by_you', 'on') }}"
                  then:
                  - event: dump_control_switching
                    event_data:
                      sock: "{{ repeat.item }}"
                      state: "off"
                  - action: switch.turn_off
                    target:
                      entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                - action: timer.cancel
                  target:
                    entity_id: "timer.plug_{{ repeat.item }}_min_on"
                - action: timer.start
                  target:
                    entity_id: "timer.plug_{{ repeat.item }}_cooldown"
                - variables:
                    sock: "{{ repeat.item }}"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                    message: >-
                      {{ label }}: turned OFF by "Dump OFF Sungold sockets: Sungold voltage guard": Sungold {{ states('sensor.sungold-inverter-1_battery_voltage') }} V, T2 {{ states('sensor.battery_1_voltage') }} V, KU {{ states('sensor.battery_2_voltage') }} V ({{ state_attr('binary_sensor.dump_inverter-1-vguard', 'reason') }}). Cooldown 10 min.



  - id: dump_inverter-1-vguard_inlet_off
    alias: "Dump ALERT Sungold voltage guard: charge inlet stayed off"
    description: >
      The Sungold voltage guard has stayed on for the dwell helper, and no socket
      whose Use is Sungold charge and whose Inverter is T2 or KU is on. Waits until
      that inlet is on, the guard clears, or the charge rule has had its dwell plus
      the 3 minute plug wait (and 30 seconds). Notifies only if the guard is still
      on and the inlet stayed off. Does not notify while the inlet is on. Does not
      switch sockets. notification_id sungold_vguard_inlet_off replaces the previous
      popup. See docs/site-solar/dump-sph-vguard.md.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.dump_inverter-1-vguard
        to: "on"
        for:
          seconds: "{{ states('input_number.dump_inverter-1-vguard_dwell_s') | int(0) }}"
    conditions:
      - condition: state
        entity_id: binary_sensor.dump_inverter-1-vguard
        state: "on"
    actions:
      - wait_template: >
          {% set ns = namespace(on=false) %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
            {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
               and states('input_select.plug_' ~ s ~ '_inverter') in ['T2', 'KU']
               and is_state('switch.ihoment_plug_' ~ s, 'on') %}
              {% set ns.on = true %}
            {% endif %}
          {% endfor %}
          {{ (not is_state('binary_sensor.dump_inverter-1-vguard', 'on')) or ns.on }}
        timeout: >
          {% set g = states('input_number.dump_inverter-1-vguard_dwell_s') | int(0) %}
          {% set c = states('input_number.inverter-1-charge_dwell_s') | int(0) %}
          {% set extra = [0, c - g] | max + 210 %}
          {{ '%02d:%02d:%02d' % (extra // 3600, (extra % 3600) // 60, extra % 60) }}
        continue_on_timeout: true
      - condition: state
        entity_id: binary_sensor.dump_inverter-1-vguard
        state: "on"
      - condition: template
        value_template: >
          {% set ns = namespace(on=false) %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
            {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
               and states('input_select.plug_' ~ s ~ '_inverter') in ['T2', 'KU']
               and is_state('switch.ihoment_plug_' ~ s, 'on') %}
              {% set ns.on = true %}
            {% endif %}
          {% endfor %}
          {{ not ns.on }}
      - variables:
          msg: >-
            The Sungold voltage guard is on and the charge inlet stayed off.
            Turn on the socket whose Use is Sungold charge and whose Inverter is T2 or KU.
            If Enable Sungold charge is off, turn it on.
            Sungold {{ states('sensor.sungold-inverter-1_battery_voltage') }} V,
            T2 {{ states('sensor.battery_1_voltage') }} V,
            KU {{ states('sensor.battery_2_voltage') }} V.
          svc: "{{ states('input_text.dump_notify_service') | trim }}"
      - action: notify.persistent_notification
        data:
          title: Sungold charge inlet stayed off
          message: "{{ msg }}"
          notification_id: sungold_vguard_inlet_off
      - if:
          - condition: template
            value_template: "{{ svc not in ['persistent_notification', '', 'unknown', 'unavailable', 'none'] }}"
        then:
          - action: "notify.{{ svc }}"
            data:
              title: Sungold charge inlet stayed off
              message: "{{ msg }}"

  - id: dump_inverter-1-vguard_inlet_off_clear
    alias: "Dump ALERT Sungold voltage guard: inlet off cleared"
    description: >
      Dismisses sungold_vguard_inlet_off when the voltage guard turns off or a
      Sungold charge inlet (Use Sungold charge, Inverter T2 or KU) turns on.
      Does not switch sockets.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
