              then:
              - event: dump_control_switching
                event_data:
                  sock: "{{ repeat.item }}"
                  state: "off"
              - action: switch.turn_off
                target:
                  entity_id: "switch.ihoment_plug_{{ repeat.item }}"
            - action: timer.cancel
              target:
                entity_id: "timer.plug_{{ repeat.item }}_min_on"
            - action: timer.start
              target:
                entity_id: "timer.plug_{{ repeat.item }}_cooldown"
            - variables:
                sock: "{{ repeat.item }}"
            - *socket_label
            - action: logbook.log
              data:
                name: Dump control
                entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                message: >-
                  {{ label }}: turned OFF by "Dump OFF T2 sockets: T2 battery discharging past limit": T2 battery power {{ states('sensor.battery_1_power') }} W is past the -{{ states('input_number.dump_max_discharge_battery-2-w') }} W limit for 1 min. Cooldown 10 min.

