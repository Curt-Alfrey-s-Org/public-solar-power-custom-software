automation plug_held_by_you:
  - id: plug_held_by_you_from_user
    alias: "H5082 held by you: Home Assistant user toggled the socket"
    description: >
      A Home Assistant user changed the switch (context.user_id is set).
      Mark that socket held by you. A press on the plug itself is not covered.
      See docs/site-solar/dump-hold.md.
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id:
        - switch.plug-1_left
        - switch.plug-1_right
        - switch.plug-2_left
        - switch.plug-2_right
        - switch.plug-3_left
        - switch.plug-3_right
        - switch.plug-4_left
        - switch.plug-4_right
        - switch.plug-5_left
        - switch.plug-5_right
        - switch.plug-6_left
        - switch.plug-6_right
        - switch.plug-7_left
        - switch.plug-7_right
        - switch.plug-8_left
        - switch.plug-8_right
    conditions:
      - condition: template
        value_template: >
          {% set sock = trigger.entity_id | replace('switch.ihoment_plug_', '') %}
          {% set use = states('input_select.plug_' ~ sock ~ '_use') %}
          {% set inv = states('input_select.plug_' ~ sock ~ '_inverter') %}
          {{ trigger.to_state.context.user_id is not none
             and ((use == 'dump' and inv != 'House') or use == 'Sungold charge') }}
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: >
            {{ 'input_boolean.plug_' ~ (trigger.entity_id | replace('switch.ihoment_plug_', '')) ~ '_held_by_you' }}

  - id: plug_held_by_you_automate
    alias: "H5082 held by you: Automate"
    description: >
      The Automate button for one socket. Turns that held-by-you flag off so
      dump and Sungold charge rules may switch it again.
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id:
        - input_button.plug-1_left_automate
        - input_button.plug-1_right_automate
        - input_button.plug-2_left_automate
        - input_button.plug-2_right_automate
        - input_button.plug-3_left_automate
        - input_button.plug-3_right_automate
        - input_button.plug-4_left_automate
        - input_button.plug-4_right_automate
        - input_button.plug-5_left_automate
        - input_button.plug-5_right_automate
        - input_button.plug-6_left_automate
        - input_button.plug-6_right_automate
        - input_button.plug-7_left_automate
        - input_button.plug-7_right_automate
        - input_button.plug-8_left_automate
        - input_button.plug-8_right_automate
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: >
            {{ 'input_boolean.plug_' ~ (trigger.entity_id | replace('input_button.plug_', '') | replace('_automate', '')) ~ '_held_by_you' }}

  - id: plug_held_by_you_notify
    alias: "H5082 held by you: notification"
    description: >
      One persistent notification, id plug_held_by_you, listing sockets a
      Home Assistant user is holding. Dismissed when none are held.
    mode: queued
    max: 20
    triggers:
      - trigger: state
        entity_id:
        - input_boolean.plug-1_left_held_by_you
        - input_boolean.plug-1_right_held_by_you
        - input_boolean.plug-2_left_held_by_you
        - input_boolean.plug-2_right_held_by_you
        - input_boolean.plug-3_left_held_by_you
        - input_boolean.plug-3_right_held_by_you
        - input_boolean.plug-4_left_held_by_you
        - input_boolean.plug-4_right_held_by_you
        - input_boolean.plug-5_left_held_by_you
        - input_boolean.plug-5_right_held_by_you
        - input_boolean.plug-6_left_held_by_you
        - input_boolean.plug-6_right_held_by_you
        - input_boolean.plug-7_left_held_by_you
        - input_boolean.plug-7_right_held_by_you
        - input_boolean.plug-8_left_held_by_you
        - input_boolean.plug-8_right_held_by_you
    actions:
      - variables:
          held: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% if is_state('input_boolean.plug_' ~ s ~ '_held_by_you', 'on') %}
                {% set ns.out = ns.out + ['switch.ihoment_plug_' ~ s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out | join(', ') }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ held | trim != '' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  notification_id: plug_held_by_you
                  title: Socket held by you
                  message: >
                    Home Assistant will not switch {{ held }}.
                    Press Automate on that socket to let Home Assistant control it again.
        default:
          - action: persistent_notification.dismiss
            data:
              notification_id: plug_held_by_you
