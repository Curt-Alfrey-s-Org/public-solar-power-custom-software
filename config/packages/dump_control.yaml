template:
  # Dump control's own switch requests. Every dump rule fires the event
  # dump_control_switching (sock, state) right before switch.turn_on / turn_off.
  # The H5082 switches are MQTT switches with a state topic: their state changes carry
  # a fresh context (no user, no parent automation), so context cannot tell a dump rule
  # from a hand switch. `intents` keeps one [state, unix time] per socket; "Dump HOLD
  # start" treats a change that matches a request from the last 3 min as dump control.
  - triggers:
      - trigger: event
        event_type: dump_control_switching
    sensor:
      - name: Dump control switching
        unique_id: dump_control_switching
        default_entity_id: sensor.dump_control_switching
        icon: mdi:robot-outline
        state: "{{ trigger.event.data.sock }} {{ trigger.event.data.state }}"
        attributes:
          intents: >-
            {%- set old = this.attributes.get('intents') if this is defined and this.attributes is defined else none -%}
            {%- set old = old if old is mapping else {} -%}
            {{ dict(old.items() | list + [(trigger.event.data.sock, [trigger.event.data.state, as_timestamp(now()) | round(0)])]) }}
  - sensor:
      - name: Dump sockets
        unique_id: dump_sockets
        default_entity_id: sensor.dump_sockets
        icon: mdi:power-socket-us
        state: >
          {% set ns = namespace(n=0) %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
            {% if (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on')) %}{% set ns.n = ns.n + 1 %}{% endif %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          entities: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% if (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on')) %}
                {% set ns.out = ns.out + ['switch.ihoment_plug_' ~ s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
          held: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% if states('timer.plug_' ~ s ~ '_hold') in ['active', 'paused'] %}
                {% set ns.out = ns.out + ['switch.ihoment_plug_' ~ s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - name: Dump surplus
        unique_id: dump_surplus_w
        default_entity_id: sensor.dump_surplus_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        # Briefing only. Live PV is the KU SmartSolar 100/50 plus Sungold PV.
        # The three BlueSolar 75/15 are unused. T2 adds nothing.
        # https://www.home-assistant.io/integrations/template/
        state: >
          {% set ss = states('sensor.victron-mppt-1_solar_power') %}
          {% set sg = states('sensor.sungold-inverter-1_pv_power') %}
          {% set ns = namespace(total=0, n=0) %}
          {% if is_number(ss) %}{% set ns.total = ns.total + (ss | float) %}{% set ns.n = ns.n + 1 %}{% endif %}
          {% if is_number(sg) %}{% set ns.total = ns.total + (sg | float) %}{% set ns.n = ns.n + 1 %}{% endif %}
          {% if ns.n == 0 %}
            {{ none }}
          {% else %}
            {{ ns.total }}
          {% endif %}
      - name: T2 PV now
        unique_id: battery-2-pv_now
        default_entity_id: sensor.battery-2-pv_now
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        # No MPPT on T2 tonight. Not a second charger. The 100/50 solar watts are in KU PV now.
        # https://www.home-assistant.io/integrations/template/
        state: "0"
      - name: KU PV now
        unique_id: battery-1-pv_now
        default_entity_id: sensor.battery-1-pv_now
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        # Only the SmartSolar 100/50. The three BlueSolar 75/15 are unused.
        # https://www.home-assistant.io/integrations/template/
        state: >
          {% set ss = states('sensor.victron-mppt-1_solar_power') %}
          {{ (ss | float) if is_number(ss) else none }}
      - name: T2 bus load W
        unique_id: battery-2-bus_load_w
        default_entity_id: sensor.battery-2-bus_load_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set sg = states('sensor.sungold-inverter-1_charging_power') %}
          {% if is_number(sg) and (sg | float) >= 0 %}
            {{ sg | float }}
          {% else %}
            0
          {% endif %}
      - name: T2-KU jumper
        unique_id: battery-2-battery-1-jumper_w
        default_entity_id: sensor.battery-2-battery-1-jumper_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        # No T2 charger. The 100/50 is on KU, so its battery watts are not a T2 term.
        # + is into T2 from KU. T2 bus load is Sungold charging_power.
        # https://www.home-assistant.io/integrations/template/
        state: >
          {% set b = states('sensor.battery_1_power') %}
          {% set load = states('sensor.battery-2-bus_load_w') %}
          {% if is_number(b) and is_number(load) %}
            {{ (b | float) + (load | float) }}
          {% else %}
            {{ none }}
          {% endif %}
      - name: T2-KU jumper amps
        unique_id: battery-2-battery-1-jumper_a
        default_entity_id: sensor.battery-2-battery-1-jumper_a
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: >
          {% set b = states('sensor.battery_1_current') %}
          {% set loadw = states('sensor.battery-2-bus_load_w') %}
          {% set bv = states('sensor.battery_1_voltage') %}
          {% if is_number(b) and is_number(loadw) and is_number(bv) and (bv | float) > 0 %}
            {% set loada = (loadw | float) / (bv | float) %}
            {{ (b | float) + loada }}
          {% else %}
            {{ none }}
          {% endif %}
      - name: Silent KU 75/15
        unique_id: battery-1-silent_mppt_w
        default_entity_id: sensor.battery-1-silent_mppt_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        # All three BlueSolar 75/15 are unused (2026-10-08 evening). Not a live charger.
        state: "0"
      - name: Silent KU 75/15 amps
        unique_id: battery-1-silent_mppt_a
        default_entity_id: sensor.battery-1-silent_mppt_a
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: "0"
      - name: Silent KU 75/15 size check
        unique_id: battery-1-silent_mppt_third_w
        default_entity_id: sensor.battery-1-silent_mppt_third_w
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        # Unused. The 75/15 size check is not a live charger.
        state: "0"
      - name: Dump bus load T2
        unique_id: dump_bus_load_t2
        default_entity_id: sensor.dump_bus_load_t2
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.battery_1_power') %}
          {{ (-1 * (p | float)) if is_number(p) else none }}
      - name: Dump bus load KU
        unique_id: dump_bus_load_ku
        default_entity_id: sensor.dump_bus_load_ku
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.battery_2_power') %}
          {{ (-1 * (p | float)) if is_number(p) else none }}
      - name: Dump bus load Sungold
        unique_id: dump_bus_load_sph
        default_entity_id: sensor.dump_bus_load_sph
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.sungold-inverter-1_load_power') %}
          {{ (p | float) if is_number(p) else none }}
      - name: Dump next plug
        unique_id: dump_next_plug
        default_entity_id: sensor.dump_next_plug
        icon: mdi:power-socket-us
        state: >
          {% set socks = [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
          {% set lim_t2 = states('input_number.dump_ac_limit_battery-2-w') | float(2000) %}
          {% set lim_ku = states('input_number.dump_ac_limit_battery-1-w') | float(2000) %}
          {% set lim_sph = states('input_number.dump_ac_limit_inverter-1-w') | float(2000) %}
          {% set sg = states('sensor.sungold-inverter-1_load_power') | float(0)
             if is_number(states('sensor.sungold-inverter-1_load_power')) else 0 %}
          {% set battery-2-pack = states('sensor.battery_1_power') | float(0)
             if is_number(states('sensor.battery_1_power')) else 0 %}
          {% set battery-1-pack = states('sensor.battery_2_power') | float(0)
             if is_number(states('sensor.battery_2_power')) else 0 %}
          {% set battery-2-from_batt = [0, -battery-2-pack] | max %}
          {% set battery-1-from_batt = [0, -battery-1-pack] | max %}
          {% set head = {
            'T2': lim_t2 - battery-2-from_batt,
            'KU': lim_ku - battery-1-from_batt,
            'Sungold': lim_sph - sg,
          } %}
          {% set batt = {
            'T2': is_state('binary_sensor.dump_batt_battery-2-ok', 'on'),
            'KU': is_state('binary_sensor.dump_batt_battery-1-ok', 'on'),
            'Sungold': is_state('binary_sensor.dump_batt_inverter-1-ok', 'on'),
          } %}
          {% set vfloat = {
            'T2': is_state('binary_sensor.dump_v_float_t2', 'on'),
            'KU': is_state('binary_sensor.dump_v_float_ku', 'on'),
            'Sungold': is_state('binary_sensor.dump_v_float_sph', 'on'),
          } %}
          {% set vrebulk = {
            'T2': is_state('binary_sensor.dump_v_rebulk_t2', 'on'),
            'KU': is_state('binary_sensor.dump_v_rebulk_ku', 'on'),
            'Sungold': is_state('binary_sensor.dump_v_rebulk_sph', 'on'),
          } %}
          {% set minw = states('input_number.dump_min_solar_w') | float(50) %}
          {% set kupv = states('sensor.victron-mppt-1_solar_power') %}
          {% set t2pv = 0 %}
          {% set sgpv = states('sensor.sungold-inverter-1_pv_power') %}
          {% set pv_ok = {
            'T2': (is_number(t2pv) and (t2pv | float) >= minw),
            'KU': (is_number(kupv) and (kupv | float) >= minw) or ((states('sensor.victron-mppt-1_battery_state') | lower) in ['absorption', 'float']),
            'Sungold': false,
          } %}
          {% set t2st = '' %}
          {% set kua = states('sensor.victron-mppt-1_battery_state') | lower %}
          {% set kub = '' %}
          {% set absorb_float = ['absorption', 'float'] %}
          {% set stage_ok = {
            'T2': t2st in absorb_float,
            'KU': kua in absorb_float or kub in absorb_float,
            'Sungold': false,
          } %}
          {% set deltaw = states('input_number.dump_site_delta_min_w') | float(25) %}
          {% set soc_min = states('input_number.dump_min_soc_percent') | float(90) %}
          {% set soc_skip = is_state('input_boolean.dump_soc_unsynced', 'on') %}
          {% set t2soc = states('sensor.battery_1_state_of_charge') %}
          {% set kusoc = states('sensor.battery_2_state_of_charge') %}
          {% set soc_bus = {
            'T2': soc_skip or (is_number(t2soc) and (t2soc | float) >= soc_min),
            'KU': soc_skip or (is_number(kusoc) and (kusoc | float) >= soc_min),
            'Sungold': true,
          } %}
          {% if not is_state('binary_sensor.dump_solar_present', 'on') %}
            none
          {% else %}
            {% set pick = namespace(eid='none') %}
            {% for s in socks %}
              {% set eid = 'switch.ihoment_plug_' ~ s %}
              {% set load_txt = states('input_text.plug_' ~ s ~ '_load') | trim %}
              {% set nums = load_txt | regex_findall('(\d+)') %}
              {% set parsed_w = (nums[0] | int(0)) if nums else 0 %}
              {% set est_w = [deltaw, parsed_w] | max if parsed_w > 0 else deltaw %}
              {% set ready = namespace(ok=false) %}
              {% for b in ['T2', 'KU', 'Sungold'] %}
                {% set shunt_p = states('sensor.battery_2_power') if b == 'KU' else (states('sensor.sungold-inverter-1_load_power') if b == 'Sungold' else states('sensor.battery_1_power')) %}
                {% set stage = states('sensor.victron-mppt-1_battery_state') | lower if b == 'KU' else '' %}
                {% set stage2 = '' %}
                {% set throttled_b = stage in ['absorption', 'float'] or stage2 in ['absorption', 'float'] %}
                {% set head_ok = (head.get(b, -1) > est_w) if b == 'Sungold' else ((is_number(shunt_p) and (shunt_p | float) > (est_w + minw)) or throttled_b) %}
                {% if (not ready.ok)
                   and not (b == 'Sungold' and is_state('binary_sensor.dump_inverter-1-vguard', 'on'))
                   and (batt.get(b, False) or throttled_b)
                   and pv_ok.get(b, False) and stage_ok.get(b, False)
                   and vfloat.get(b, False) and not vrebulk.get(b, False)
                   and head.get(b, -1) > 0 and head_ok %}
                  {% set ready.ok = true %}
                {% endif %}
              {% endfor %}
              {% if pick.eid == 'none'
                 and (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on')) and states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused']
                 and is_state(eid, 'off')
                 and (is_state('timer.plug_' ~ s ~ '_cooldown', 'idle') or is_state('input_boolean.dump_skip_cooldown', 'on'))
                 and not is_state('input_boolean.plug_' ~ s ~ '_held_by_you', 'on')
                 and ready.ok %}
                {% set pick.eid = eid %}
              {% endif %}
            {% endfor %}
            {{ pick.eid }}
          {% endif %}
        attributes:
          surplus_w: "{{ states('sensor.dump_surplus_w') | float(0) if is_number(states('sensor.dump_surplus_w')) else none }}"
          sungold_load_w: "{{ states('sensor.sungold-inverter-1_load_power') | float(0) if is_number(states('sensor.sungold-inverter-1_load_power')) else 0 }}"
          battery-2-pack_w: "{{ states('sensor.battery_1_power') | float(0) if is_number(states('sensor.battery_1_power')) else none }}"
          battery-1-pack_w: "{{ states('sensor.battery_2_power') | float(0) if is_number(states('sensor.battery_2_power')) else none }}"
          charge_float: "{{ is_state('binary_sensor.dump_charge_float', 'on') }}"
          solar_present: "{{ is_state('binary_sensor.dump_solar_present', 'on') }}"
      - name: Dump shed plug
        unique_id: dump_shed_plug
        default_entity_id: sensor.dump_shed_plug
        icon: mdi:power-socket-us
        state: >
          {% set pick = namespace(eid='none') %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] | reverse %}
            {% set eid = 'switch.ihoment_plug_' ~ s %}
            {% if pick.eid == 'none' and (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on')) and (states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on'))
               and is_state(eid, 'on') %}
              {% set pick.eid = eid %}
            {% endif %}
          {% endfor %}
          {{ pick.eid }}
        attributes:
          selection: >
            Measured bus V/A/W. The inverter label is not the decider.
            H5082 has no per-socket power sensor, so every dump socket is
            eligible when a bus is at or under stop or past its discharge limit.
          trouble_buses: >
            {% set ns = namespace(b=[]) %}
            {% if is_state('binary_sensor.dump_v_rebulk_t2', 'on') or is_state('binary_sensor.dump_batt_battery-2-ok', 'off') %}
              {% set ns.b = ns.b + ['T2'] %}
            {% endif %}
            {% if is_state('binary_sensor.dump_v_rebulk_ku', 'on') or is_state('binary_sensor.dump_batt_battery-1-ok', 'off') %}
              {% set ns.b = ns.b + ['KU'] %}
            {% endif %}
            {% if is_state('binary_sensor.dump_v_rebulk_sph', 'on') or is_state('binary_sensor.dump_batt_inverter-1-ok', 'off') or is_state('binary_sensor.dump_inverter-1-vguard', 'on') %}
              {% set ns.b = ns.b + ['Sungold'] %}
            {% endif %}
            {{ ns.b | join(',') }}
      - name: Dump on demand next on
        unique_id: dump_ondemand_on
        default_entity_id: sensor.dump_ondemand_on
        icon: mdi:power-plug
        # What "Turn next dump ON" would switch. Same socket order as dump_next_plug,
        # but it does not wait for float, solar, SoC, start volts, battery or AC headroom.
        # It still skips a held socket, a cooldown (unless skip cooldown is on), and House.
        # The inverter label does not skip a socket while the voltage guard is on.
        state: >
          {% set skip = is_state('input_boolean.dump_skip_cooldown', 'on') %}
          {% set pick = namespace(eid='none') %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
            {% set eid = 'switch.ihoment_plug_' ~ s %}
            {% if pick.eid == 'none'
               and (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on')) and states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused']
               and is_state(eid, 'off')
               and (is_state('timer.plug_' ~ s ~ '_cooldown', 'idle') or skip) %}
              {% set pick.eid = eid %}
            {% endif %}
          {% endfor %}
          {{ pick.eid }}
      - name: Dump on demand off count
        unique_id: dump_ondemand_off
        default_entity_id: sensor.dump_ondemand_off
        icon: mdi:power-plug-off
        # How many dump sockets "Turn dumps OFF" would switch: on, not House, not on hold.
        state: >
          {% set ns = namespace(n=0) %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
            {% if (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on')) and states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused']
               and is_state('switch.ihoment_plug_' ~ s, 'on') %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          sockets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% if (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on')) and states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused']
                 and is_state('switch.ihoment_plug_' ~ s, 'on') %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - name: Dump Sungold voltage gap
        unique_id: dump_inverter-1-vguard_gap
        default_entity_id: sensor.dump_inverter-1-vguard_gap
        unit_of_measurement: V
        state_class: measurement
        icon: mdi:delta
        # Sungold battery volts minus the lower of the live T2 and KU shunt volts.
        # Negative means Sungold is below that shunt. None when a side is missing.
        state: >
          {% set raw_v = states('sensor.sungold-inverter-1_battery_voltage') %}
          {% set raw_t2 = states('sensor.battery_1_voltage') %}
          {% set raw_ku = states('sensor.battery_2_voltage') %}
          {% set refs = [] %}
          {% if is_number(raw_t2) %}{% set refs = refs + [raw_t2 | float] %}{% endif %}
          {% if is_number(raw_ku) %}{% set refs = refs + [raw_ku | float] %}{% endif %}
          {% if is_number(raw_v) and refs %}
            {{ (raw_v | float - (refs | min)) | round(3) }}
          {% else %}
            none
          {% endif %}

      - name: T2 time remaining
        unique_id: battery-2-time_remaining_words
        default_entity_id: sensor.battery-2-time_remaining_words
        # SmartShunt time-to-go is only a discharge estimate.
        # https://www.victronenergy.com/media/pg/SmartShunt/en/operation.html
        # 14400 minutes is the value this shunt publishes when it is not counting down.
        state: >
          {% set mins = states('sensor.battery_1_remaining_minutes') %}
          {% set watts = states('sensor.battery_1_power') %}
          {% if is_number(watts) and (watts | float) > 0 %}
            Charging
          {% elif is_number(mins) and (mins | float) >= 14400 %}
            Not discharging
          {% elif is_number(mins) %}
            {{ mins | float | round(0) }} min
          {% else %}
            unknown
          {% endif %}
      - name: KU time remaining
        unique_id: battery-1-time_remaining_words
        default_entity_id: sensor.battery-1-time_remaining_words
        state: >
          {% set mins = states('sensor.battery_2_remaining_minutes') %}
          {% set watts = states('sensor.battery_2_power') %}
          {% if is_number(watts) and (watts | float) > 0 %}
            Charging
          {% elif is_number(mins) and (mins | float) >= 14400 %}
            Not discharging
          {% elif is_number(mins) %}
            {{ mins | float | round(0) }} min
          {% else %}
            unknown
          {% endif %}
      - name: T2 Ah removed
        unique_id: battery-2-ah_balance_words
        default_entity_id: sensor.battery-2-ah_balance_words
        # Negative Consumed Ah means amp-hours removed from the battery.
        # https://www.victronenergy.com/media/pg/SmartShunt/en/operation.html
        state: >
          {% set ah = states('sensor.battery_1_consumed_ah') %}
          {% if not is_number(ah) %}
            unknown
          {% elif (ah | float) < 0 %}
            {{ (ah | float) | abs | round(1) }} Ah out
          {% elif (ah | float) > 0 %}
            {{ (ah | float) | round(1) }} Ah in
          {% else %}
            0
          {% endif %}
      - name: KU Ah removed
        unique_id: battery-1-ah_balance_words
        default_entity_id: sensor.battery-1-ah_balance_words
        state: >
          {% set ah = states('sensor.battery_2_consumed_ah') %}
          {% if not is_number(ah) %}
            unknown
          {% elif (ah | float) < 0 %}
            {{ (ah | float) | abs | round(1) }} Ah out
          {% elif (ah | float) > 0 %}
            {{ (ah | float) | round(1) }} Ah in
          {% else %}
            0
          {% endif %}
      - name: Sungold output mode words
        unique_id: sungold_output_mode_words
        default_entity_id: sensor.sungold_output_mode_words
        # Register 0x0210 map in sungold_modbus_ro/registers.py MACHINE_STATES.
        # Values outside that map stay unnamed.
        state: >
          {% set raw = states('sensor.sungold-inverter-1_inverter_state') %}
          {% set names = {
            '0': 'Initialization',
            '1': 'Standby',
            '2': 'Mains output',
            '3': 'Inverter output'
          } %}
          {{ names.get(raw, 'Not in the mode map (' ~ raw ~ ')') }}

      - name: Sungold charge status
        unique_id: inverter-1-charge_status
        default_entity_id: sensor.inverter-1-charge_status
        icon: mdi:battery-charging
        # Short why for the Site solar box. Sockets with Use Sungold charge are not dumps.
        state: >
          {% set enabled = is_state('input_boolean.inverter-1-charge_enabled', 'on') %}
          {% set need = is_state('binary_sensor.inverter-1-charge_need', 'on') %}
          {% set dark = is_state('binary_sensor.inverter-1-charge_inlet_dark', 'on') %}
          {% set raw_v = states('sensor.sungold-inverter-1_battery_voltage') %}
          {% set raw_full = states('input_number.inverter-1-charge_full_v') %}
          {% set under = is_number(raw_v) and is_number(raw_full) and (raw_v | float) < (raw_full | float) %}
          {% set ns = namespace(n=0, held=false) %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
            {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
               and is_state('switch.ihoment_plug_' ~ s, 'on') %}
              {% set ns.n = ns.n + 1 %}
              {% if states('timer.plug_' ~ s ~ '_hold') in ['active', 'paused'] %}
                {% set ns.held = true %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if not enabled %}
            Off
          {% elif dark %}
            Inlet on, no grid
          {% elif ns.n > 0 and ns.held %}
            Held by hand
          {% elif ns.n > 0 and need %}
            Charging
          {% elif ns.n > 0 and is_state('binary_sensor.inverter-1-charge_banks_feed', 'on') %}
            On, solar feed
          {% elif ns.n > 0 and under %}
            On, under full volts
          {% elif ns.n > 0 %}
            On, at full volts
          {% elif need %}
            Needs charge
          {% else %}
            Idle
          {% endif %}
        attributes:
          reason: >
            {% set enabled = is_state('input_boolean.inverter-1-charge_enabled', 'on') %}
            {% set need = is_state('binary_sensor.inverter-1-charge_need', 'on') %}
            {% set dark = is_state('binary_sensor.inverter-1-charge_inlet_dark', 'on') %}
            {% set raw_v = states('sensor.sungold-inverter-1_battery_voltage') %}
            {% set raw_full = states('input_number.inverter-1-charge_full_v') %}
            {% set under = is_number(raw_v) and is_number(raw_full) and (raw_v | float) < (raw_full | float) %}
            {% set ns = namespace(n=0, held=false) %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
                 and is_state('switch.ihoment_plug_' ~ s, 'on') %}
                {% set ns.n = ns.n + 1 %}
                {% if states('timer.plug_' ~ s ~ '_hold') in ['active', 'paused'] %}
                  {% set ns.held = true %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% if not enabled %}
              charge control is off
            {% elif dark %}
              a Sungold charge socket is on but the inlet grid voltage is at or below 0 and charging power is about 0
            {% elif ns.n > 0 and ns.held %}
              a hand hold is keeping the Sungold charge socket on
            {% elif ns.n > 0 and need %}
              the pack is under the charge line and a Sungold charge socket is on
            {% elif ns.n > 0 and is_state('binary_sensor.inverter-1-charge_banks_feed', 'on') %}
              the feeding charger is in Absorption or Float and above its stop volts, so the inlet stays on
            {% elif ns.n > 0 and under %}
              a Sungold charge socket is on and Sungold volts are under the full helper
            {% elif ns.n > 0 %}
              a Sungold charge socket is on and Sungold volts are at the full helper
            {% elif need %}
              the pack is under the charge line; a socket turns on when its Inverter is T2 or KU and that bank is at the source minimum
            {% else %}
              Sungold is not under the charge line, and no Sungold charge socket is on
            {% endif %}
  - binary_sensor:
      - name: Dump un-hold for next
        unique_id: dump_unhold_for_next
        default_entity_id: binary_sensor.dump_unhold_for_next
        icon: mdi:hand-back-right
        # On only when clearing held-by-you would let dump_next_plug name that
        # socket and dump_turn_on is not already blocked by a gate it handles.
        # Site solar conditional card reads this. docs/site-solar/dump-status.md
        # https://www.home-assistant.io/integrations/template/
        state: >
            {%- set socks = [
                        'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
                        'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
                        'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
                      ] -%}
                      {%- set ready = is_state('input_boolean.dump_control_enabled', 'on')
                         and is_state('binary_sensor.dump_charge_float', 'on')
                         and is_state('binary_sensor.dump_solar_present', 'on')
                         and not is_state('binary_sensor.dump_status_pv_falling', 'on')
                         and not is_state('binary_sensor.dump_load_exceeds_solar', 'on')
                         and states('sensor.dump_next_plug') == 'none' -%}
                      {%- set ns = namespace(rows=[]) -%}
                      {%- if ready -%}
                      {%- set lim_t2 = states('input_number.dump_ac_limit_battery-2-w') | float(2000) -%}
                      {%- set lim_ku = states('input_number.dump_ac_limit_battery-1-w') | float(2000) -%}
                      {%- set lim_sph = states('input_number.dump_ac_limit_inverter-1-w') | float(2000) -%}
                      {%- set sg = states('sensor.sungold-inverter-1_load_power') | float(0)
                         if is_number(states('sensor.sungold-inverter-1_load_power')) else 0 -%}
                      {%- set battery-2-pack = states('sensor.battery_1_power') | float(0)
                         if is_number(states('sensor.battery_1_power')) else 0 -%}
                      {%- set battery-1-pack = states('sensor.battery_2_power') | float(0)
                         if is_number(states('sensor.battery_2_power')) else 0 -%}
                      {%- set battery-2-from_batt = [0, -battery-2-pack] | max -%}
                      {%- set battery-1-from_batt = [0, -battery-1-pack] | max -%}
                      {%- set head = {
                        'T2': lim_t2 - battery-2-from_batt,
                        'KU': lim_ku - battery-1-from_batt,
                        'Sungold': lim_sph - sg,
                      } -%}
                      {%- set batt = {
                        'T2': is_state('binary_sensor.dump_batt_battery-2-ok', 'on'),
                        'KU': is_state('binary_sensor.dump_batt_battery-1-ok', 'on'),
                        'Sungold': is_state('binary_sensor.dump_batt_inverter-1-ok', 'on'),
                      } -%}
                      {%- set vfloat = {
                        'T2': is_state('binary_sensor.dump_v_float_t2', 'on'),
                        'KU': is_state('binary_sensor.dump_v_float_ku', 'on'),
                        'Sungold': is_state('binary_sensor.dump_v_float_sph', 'on'),
                      } -%}
                      {%- set vrebulk = {
                        'T2': is_state('binary_sensor.dump_v_rebulk_t2', 'on'),
                        'KU': is_state('binary_sensor.dump_v_rebulk_ku', 'on'),
                        'Sungold': is_state('binary_sensor.dump_v_rebulk_sph', 'on'),
                      } -%}
                      {%- set minw = states('input_number.dump_min_solar_w') | float(50) -%}
                      {%- set kupv = states('sensor.victron-mppt-1_solar_power') -%}
                      {%- set t2pv = 0 -%}
                      {%- set t2st = '' -%}
                      {%- set kua = states('sensor.victron-mppt-1_battery_state') | lower -%}
                      {%- set kub = '' -%}
                      {%- set absorb_float = ['absorption', 'float'] -%}
                      {%- set pv_ok = {
                        'T2': (is_number(t2pv) and (t2pv | float) >= minw),
                        'KU': (is_number(kupv) and (kupv | float) >= minw) or (kua in absorb_float),
                        'Sungold': false,
                      } -%}
                      {%- set stage_ok = {
                        'T2': t2st in absorb_float,
                        'KU': kua in absorb_float or kub in absorb_float,
                        'Sungold': false,
                      } -%}
                      {%- set deltaw = states('input_number.dump_site_delta_min_w') | float(25) -%}
                      {%- set soc_min = states('input_number.dump_min_soc_percent') | float(90) -%}
                      {%- set soc_skip = is_state('input_boolean.dump_soc_unsynced', 'on') -%}
                      {%- set t2soc = states('sensor.battery_1_state_of_charge') -%}
                      {%- set kusoc = states('sensor.battery_2_state_of_charge') -%}
                      {%- set soc_bus = {
                        'T2': soc_skip or (is_number(t2soc) and (t2soc | float) >= soc_min),
                        'KU': soc_skip or (is_number(kusoc) and (kusoc | float) >= soc_min),
                        'Sungold': true,
                      } -%}
                      {%- for s in socks -%}
                        {%- set eid = 'switch.ihoment_plug_' ~ s -%}
                        {%- set load_txt = states('input_text.plug_' ~ s ~ '_load') | trim -%}
                        {%- set nums = load_txt | regex_findall('(\d+)') -%}
                        {%- set parsed_w = (nums[0] | int(0)) if nums else 0 -%}
                        {%- set est_w = [deltaw, parsed_w] | max if parsed_w > 0 else deltaw -%}
                        {%- set ready = namespace(ok=false) -%}
                        {%- for b in ['T2', 'KU', 'Sungold'] -%}
                          {%- set shunt_p = states('sensor.battery_2_power') if b == 'KU' else (states('sensor.sungold-inverter-1_load_power') if b == 'Sungold' else states('sensor.battery_1_power')) -%}
                          {%- set stage = states('sensor.victron-mppt-1_battery_state') | lower if b == 'KU' else '' -%}
                          {%- set stage2 = '' -%}
                          {%- set throttled_b = stage in ['absorption', 'float'] or stage2 in ['absorption', 'float'] -%}
                          {%- set head_ok = (head.get(b, -1) > est_w) if b == 'Sungold' else ((is_number(shunt_p) and (shunt_p | float) > (est_w + minw)) or throttled_b) -%}
                          {%- if (not ready.ok)
                             and not (b == 'Sungold' and is_state('binary_sensor.dump_inverter-1-vguard', 'on'))
                             and (batt.get(b, False) or throttled_b)
                             and pv_ok.get(b, False) and stage_ok.get(b, False)
                             and vfloat.get(b, False) and not vrebulk.get(b, False)
                             and head.get(b, -1) > 0 and head_ok -%}
                            {%- set ready.ok = true -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {%- if is_state('input_boolean.plug_' ~ s ~ '_held_by_you', 'on')
                           and (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on'))
                           and states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused']
                           and is_state(eid, 'off')
                           and (is_state('timer.plug_' ~ s ~ '_cooldown', 'idle') or is_state('input_boolean.dump_skip_cooldown', 'on'))
                           and ready.ok -%}
                          {%- set plug = s[:4] -%}
                          {%- set side = s.split('_')[1] -%}
                          {%- set where = states('input_text.plug_' ~ plug ~ '_location') | trim -%}
                          {%- set place = where if where not in ['', 'unknown', 'unavailable', 'none'] else (plug | upper) -%}
                          {%- set ns.rows = ns.rows + [place ~ ' ' ~ side] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- endif -%}
            {{ ns.rows | count > 0 }}
        attributes:
          actions: >
            {%- set socks = [
                        'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
                        'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
                        'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
                      ] -%}
                      {%- set ready = is_state('input_boolean.dump_control_enabled', 'on')
                         and is_state('binary_sensor.dump_charge_float', 'on')
                         and is_state('binary_sensor.dump_solar_present', 'on')
                         and not is_state('binary_sensor.dump_status_pv_falling', 'on')
                         and not is_state('binary_sensor.dump_load_exceeds_solar', 'on')
                         and states('sensor.dump_next_plug') == 'none' -%}
                      {%- set ns = namespace(rows=[]) -%}
                      {%- if ready -%}
                      {%- set lim_t2 = states('input_number.dump_ac_limit_battery-2-w') | float(2000) -%}
                      {%- set lim_ku = states('input_number.dump_ac_limit_battery-1-w') | float(2000) -%}
                      {%- set lim_sph = states('input_number.dump_ac_limit_inverter-1-w') | float(2000) -%}
                      {%- set sg = states('sensor.sungold-inverter-1_load_power') | float(0)
                         if is_number(states('sensor.sungold-inverter-1_load_power')) else 0 -%}
                      {%- set battery-2-pack = states('sensor.battery_1_power') | float(0)
                         if is_number(states('sensor.battery_1_power')) else 0 -%}
                      {%- set battery-1-pack = states('sensor.battery_2_power') | float(0)
                         if is_number(states('sensor.battery_2_power')) else 0 -%}
                      {%- set battery-2-from_batt = [0, -battery-2-pack] | max -%}
                      {%- set battery-1-from_batt = [0, -battery-1-pack] | max -%}
                      {%- set head = {
                        'T2': lim_t2 - battery-2-from_batt,
                        'KU': lim_ku - battery-1-from_batt,
                        'Sungold': lim_sph - sg,
                      } -%}
                      {%- set batt = {
                        'T2': is_state('binary_sensor.dump_batt_battery-2-ok', 'on'),
                        'KU': is_state('binary_sensor.dump_batt_battery-1-ok', 'on'),
                        'Sungold': is_state('binary_sensor.dump_batt_inverter-1-ok', 'on'),
                      } -%}
                      {%- set vfloat = {
                        'T2': is_state('binary_sensor.dump_v_float_t2', 'on'),
                        'KU': is_state('binary_sensor.dump_v_float_ku', 'on'),
                        'Sungold': is_state('binary_sensor.dump_v_float_sph', 'on'),
                      } -%}
                      {%- set vrebulk = {
                        'T2': is_state('binary_sensor.dump_v_rebulk_t2', 'on'),
                        'KU': is_state('binary_sensor.dump_v_rebulk_ku', 'on'),
                        'Sungold': is_state('binary_sensor.dump_v_rebulk_sph', 'on'),
                      } -%}
                      {%- set minw = states('input_number.dump_min_solar_w') | float(50) -%}
                      {%- set kupv = states('sensor.victron-mppt-1_solar_power') -%}
                      {%- set t2pv = 0 -%}
                      {%- set t2st = '' -%}
                      {%- set kua = states('sensor.victron-mppt-1_battery_state') | lower -%}
                      {%- set kub = '' -%}
                      {%- set absorb_float = ['absorption', 'float'] -%}
                      {%- set pv_ok = {
                        'T2': (is_number(t2pv) and (t2pv | float) >= minw),
                        'KU': (is_number(kupv) and (kupv | float) >= minw) or (kua in absorb_float),
                        'Sungold': false,
                      } -%}
                      {%- set stage_ok = {
                        'T2': t2st in absorb_float,
                        'KU': kua in absorb_float or kub in absorb_float,
                        'Sungold': false,
                      } -%}
                      {%- set deltaw = states('input_number.dump_site_delta_min_w') | float(25) -%}
                      {%- set soc_min = states('input_number.dump_min_soc_percent') | float(90) -%}
                      {%- set soc_skip = is_state('input_boolean.dump_soc_unsynced', 'on') -%}
                      {%- set t2soc = states('sensor.battery_1_state_of_charge') -%}
                      {%- set kusoc = states('sensor.battery_2_state_of_charge') -%}
                      {%- set soc_bus = {
                        'T2': soc_skip or (is_number(t2soc) and (t2soc | float) >= soc_min),
                        'KU': soc_skip or (is_number(kusoc) and (kusoc | float) >= soc_min),
                        'Sungold': true,
                      } -%}
                      {%- for s in socks -%}
                        {%- set eid = 'switch.ihoment_plug_' ~ s -%}
                        {%- set load_txt = states('input_text.plug_' ~ s ~ '_load') | trim -%}
                        {%- set nums = load_txt | regex_findall('(\d+)') -%}
                        {%- set parsed_w = (nums[0] | int(0)) if nums else 0 -%}
                        {%- set est_w = [deltaw, parsed_w] | max if parsed_w > 0 else deltaw -%}
                        {%- set ready = namespace(ok=false) -%}
                        {%- for b in ['T2', 'KU', 'Sungold'] -%}
                          {%- set shunt_p = states('sensor.battery_2_power') if b == 'KU' else (states('sensor.sungold-inverter-1_load_power') if b == 'Sungold' else states('sensor.battery_1_power')) -%}
                          {%- set stage = states('sensor.victron-mppt-1_battery_state') | lower if b == 'KU' else '' -%}
                          {%- set stage2 = '' -%}
                          {%- set throttled_b = stage in ['absorption', 'float'] or stage2 in ['absorption', 'float'] -%}
                          {%- set head_ok = (head.get(b, -1) > est_w) if b == 'Sungold' else ((is_number(shunt_p) and (shunt_p | float) > (est_w + minw)) or throttled_b) -%}
                          {%- if (not ready.ok)
                             and not (b == 'Sungold' and is_state('binary_sensor.dump_inverter-1-vguard', 'on'))
                             and (batt.get(b, False) or throttled_b)
                             and pv_ok.get(b, False) and stage_ok.get(b, False)
                             and vfloat.get(b, False) and not vrebulk.get(b, False)
                             and head.get(b, -1) > 0 and head_ok -%}
                            {%- set ready.ok = true -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {%- if is_state('input_boolean.plug_' ~ s ~ '_held_by_you', 'on')
                           and (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on'))
                           and states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused']
                           and is_state(eid, 'off')
                           and (is_state('timer.plug_' ~ s ~ '_cooldown', 'idle') or is_state('input_boolean.dump_skip_cooldown', 'on'))
                           and ready.ok -%}
                          {%- set plug = s[:4] -%}
                          {%- set side = s.split('_')[1] -%}
                          {%- set where = states('input_text.plug_' ~ plug ~ '_location') | trim -%}
                          {%- set place = where if where not in ['', 'unknown', 'unavailable', 'none'] else (plug | upper) -%}
                          {%- set ns.rows = ns.rows + [place ~ ' ' ~ side] -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- endif -%}
            {%- if ns.rows -%}
            <table role="presentation" width="100%">
            {%- for name in ns.rows -%}
            <tr><td>{{ name | e }}</td><td align="right"><b>un-hold</b></td></tr>
            {%- endfor -%}
            </table>
            {%- endif -%}
      - name: Dump charge ok
        unique_id: dump_charge_ok
        default_entity_id: binary_sensor.dump_charge_ok
        state: >
          {{ states('sensor.victron-mppt-1_battery_state') | lower in ['absorption', 'float'] }}
      - name: Dump batt T2 ok
        unique_id: dump_batt_battery-2-ok
        default_entity_id: binary_sensor.dump_batt_battery-2-ok
        state: >
          {% set p = states('sensor.battery_1_power') %}
          {% set lim = states('input_number.dump_max_discharge_battery-2-w') | float(0) %}
          {{ is_number(p) and (p | float) >= -lim }}
      - name: Dump batt KU ok
        unique_id: dump_batt_battery-1-ok
        default_entity_id: binary_sensor.dump_batt_battery-1-ok
        state: >
          {% set p = states('sensor.battery_2_power') %}
          {% set lim = states('input_number.dump_max_discharge_battery-1-w') | float(0) %}
          {{ is_number(p) and (p | float) >= -lim }}
      - name: Dump batt Sungold ok
        unique_id: dump_batt_inverter-1-ok
        default_entity_id: binary_sensor.dump_batt_inverter-1-ok
        state: >
          {% set p = states('sensor.sungold-inverter-1_charging_power') %}
          {% set a = states('sensor.sungold-inverter-1_battery_current') %}
          {% set v = states('sensor.sungold-inverter-1_battery_voltage') %}
          {% set lim = states('input_number.dump_max_discharge_inverter-1-w') | float(50) %}
          {% if is_number(p) %}
            {{ (p | float) >= -lim }}
          {% elif is_number(a) and is_number(v) %}
            {{ ((a | float) * (v | float)) >= -lim }}
          {% else %}
            {{ false }}
          {% endif %}
      - name: Dump charge float
        unique_id: dump_charge_float
        default_entity_id: binary_sensor.dump_charge_float
        state: >
          {{ states('sensor.victron-mppt-1_battery_state') | lower in ['absorption', 'float'] }}
      - name: Dump T2 charger float
        unique_id: dump_battery-2-charger_float
        default_entity_id: binary_sensor.dump_battery-2-charger_float
        # No charger on T2. Off. Do not follow the KU 100/50 or a 75/15.
        state: "{{ false }}"
      - name: Dump KU charger float
        unique_id: dump_battery-1-charger_float
        default_entity_id: binary_sensor.dump_battery-1-charger_float
        # The only charger in use. Victron float 27.0 / re-bulk 26.8 stay on the voltage helpers.
        state: >
          {{ states('sensor.victron-mppt-1_battery_state') | lower in ['absorption', 'float'] }}
      - name: H5082 plugs not seen
        unique_id: plug_plugs_unseen
        default_entity_id: binary_sensor.plug_plugs_unseen
        device_class: problem
        state: >
          {% set ns = namespace(bad=[]) %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
            {% set eid = 'switch.ihoment_plug_' ~ s %}
            {% if states(eid) in ['unavailable', 'unknown'] and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on') %}
              {% set ns.bad = ns.bad + [eid] %}
            {% endif %}
          {% endfor %}
          {{ ns.bad | count > 0 }}
        attributes:
          entity_ids: >
            {% set ns = namespace(bad=[]) %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% set eid = 'switch.ihoment_plug_' ~ s %}
              {% if states(eid) in ['unavailable', 'unknown'] and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on') %}
                {% set ns.bad = ns.bad + [eid] %}
              {% endif %}
            {% endfor %}
            {{ ns.bad | join(', ') }}
      - name: Dump solar present
        unique_id: dump_solar_present
        default_entity_id: binary_sensor.dump_solar_present
        # On when the KU SmartSolar 100/50 is in Absorption or Float, or its
        # panel watts are at or above the minimum. T2 has no charger and adds
        # 0 W. The three BlueSolar 75/15 are unused. Saved watts, weather, and
        # the clock are not the signal. A full charger holds panel watts near zero.
        # https://www.victronenergy.com/media/pg/Manual_SmartSolar_MPPT_100-30__100-50/en/features.html
        state: >
          {% set minw = states('input_number.dump_min_solar_w') | float(50) %}
          {% set battery-2-full = is_state('binary_sensor.dump_battery-2-charger_float', 'on') %}
          {% set battery-1-full = is_state('binary_sensor.dump_battery-1-charger_float', 'on') %}
          {% set ss = states('sensor.victron-mppt-1_solar_power') %}
          {% set live = (ss | float(0) if is_number(ss) else 0) %}
          {{ battery-2-full or battery-1-full or (live >= minw) }}
      - name: Dump load exceeds solar
        unique_id: dump_load_exceeds_solar
        default_entity_id: binary_sensor.dump_load_exceeds_solar
        state: >
          {% set ku = states('sensor.victron-mppt-1_solar_power') %}
          {% set pv = states('sensor.sungold-inverter-1_pv_power') %}
          {% set solar = ((ku | float(0)) if is_number(ku) else 0) + ((pv | float(0)) if is_number(pv) else 0) %}
          {% set load = states('sensor.sungold-inverter-1_load_power') %}
          {% set minw = states('input_number.dump_min_solar_w') | float(50) %}
          {% set sg_over = is_number(solar) and is_number(load)
             and (solar | float) >= minw
             and (load | float) > (solar | float) %}
          {% set t2p = states('sensor.battery_1_power') %}
          {% set k2p = states('sensor.battery_2_power') %}
          {% set ns = namespace(battery-2-dump=false, battery-1-dump=false) %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
            {% set bus = states('input_select.plug_' ~ s ~ '_inverter') %}
            {% if (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on'))
               and is_state('switch.ihoment_plug_' ~ s, 'on') %}
              {% if bus == 'KU' %}
                {% set ns.battery-1-dump = true %}
              {% elif bus == 'T2' or bus == 'Sungold' %}
                {% set ns.battery-2-dump = true %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% set t2stage = '' %}
          {% set kustage = states('sensor.victron-mppt-1_battery_state') | lower %}
          {% set kustage2 = '' %}
          {% set sky = states('weather.hygrometer-1') %}
          {% set daytime = sky in ['sunny', 'partlycloudy', 'cloudy', 'windy', 'windy-variant'] %}
          {% set battery-2-folded = daytime and t2stage in ['absorption', 'float'] %}
          {% set battery-1-folded = daytime and (kustage in ['absorption', 'float'] or kustage2 in ['absorption', 'float']) %}
          {% set battery-2-low = ns.battery-2-dump and (not battery-2-folded) and is_number(t2p) and (t2p | float) <= minw %}
          {% set battery-1-low = ns.battery-1-dump and (not battery-1-folded) and is_number(k2p) and (k2p | float) <= minw %}
          {{ (not is_state('binary_sensor.dump_solar_present', 'on')) and (sg_over or battery-2-low or battery-1-low) }}
      - name: Dump SoC ok
        unique_id: dump_soc_ok
        default_entity_id: binary_sensor.dump_soc_ok
        state: >
          {% if is_state('input_boolean.dump_soc_unsynced', 'on') %}
            {{ true }}
          {% else %}
            {% set m = states('input_number.dump_min_soc_percent') | float(90) %}
            {% set t2 = states('sensor.battery_1_state_of_charge') %}
            {% set ku = states('sensor.battery_2_state_of_charge') %}
            {{ (is_number(t2) and (t2 | float) >= m) or (is_number(ku) and (ku | float) >= m) }}
          {% endif %}
      - name: Dump SoC hold trips
        unique_id: dump_soc_hold_trips
        default_entity_id: binary_sensor.dump_soc_hold_trips
        # Lower of T2 and KU. Above the no-trip helper, cloud trips stay off.
        # At or below the floor, those trips run. Between them, this.state holds
        # the previous result (Home Assistant template this.state).
        # https://www.home-assistant.io/integrations/template/
        state: >
          {% if is_state('input_boolean.dump_soc_unsynced', 'on') %}
            {{ false }}
          {% else %}
            {% set hi = states('input_number.dump_soc_no_trip_percent') | float(91) %}
            {% set lo = states('input_number.dump_soc_trip_floor_percent') | float(90) %}
            {% set vals = namespace(n=[]) %}
            {% set t2 = states('sensor.battery_1_state_of_charge') %}
            {% set ku = states('sensor.battery_2_state_of_charge') %}
            {% if is_number(t2) %}
              {% set vals.n = vals.n + [t2 | float] %}
            {% endif %}
            {% if is_number(ku) %}
              {% set vals.n = vals.n + [ku | float] %}
            {% endif %}
            {% if vals.n | count == 0 or lo >= hi %}
              {{ false }}
            {% else %}
              {% set lower = vals.n | min %}
              {% if lower > hi %}
                {{ true }}
              {% elif lower <= lo %}
                {{ false }}
              {% else %}
                {{ this.state == 'on' }}
              {% endif %}
            {% endif %}
          {% endif %}
      - name: Dump T2 float hold
        unique_id: dump_v_float_t2
        default_entity_id: binary_sensor.dump_v_float_t2
        state: >
          {% set v = states('sensor.battery_1_voltage') %}
          {% set fl = states('input_number.dump_float_battery-2-v') %}
          {{ is_number(v) and is_number(fl) and (v | float) >= (fl | float) }}
      - name: Dump T2 re-bulk
        unique_id: dump_v_rebulk_t2
        default_entity_id: binary_sensor.dump_v_rebulk_t2
        state: >
          {% set v = states('sensor.battery_1_voltage') %}
          {% set rb = states('input_number.dump_rebulk_battery-2-v') %}
          {{ is_number(v) and is_number(rb) and (v | float) <= (rb | float) }}
      - name: Dump KU float hold
        unique_id: dump_v_float_ku
        default_entity_id: binary_sensor.dump_v_float_ku
        state: >
          {% set v = states('sensor.battery_2_voltage') %}
          {% set fl = states('input_number.dump_float_battery-1-v') %}
          {{ is_number(v) and is_number(fl) and (v | float) >= (fl | float) }}
      - name: Dump KU re-bulk
        unique_id: dump_v_rebulk_ku
        default_entity_id: binary_sensor.dump_v_rebulk_ku
        state: >
          {% set v = states('sensor.battery_2_voltage') %}
          {% set rb = states('input_number.dump_rebulk_battery-1-v') %}
          {{ is_number(v) and is_number(rb) and (v | float) <= (rb | float) }}
      - name: Dump Sungold float hold
        unique_id: dump_v_float_sph
        default_entity_id: binary_sensor.dump_v_float_sph
        state: >
          {% set v = states('sensor.sungold-inverter-1_battery_voltage') %}
          {% set fl = states('input_number.dump_float_inverter-1-v') %}
          {{ is_number(v) and is_number(fl) and (v | float) >= (fl | float) }}
      - name: Dump Sungold re-bulk
        unique_id: dump_v_rebulk_sph
        default_entity_id: binary_sensor.dump_v_rebulk_sph
        state: >
          {% set v = states('sensor.sungold-inverter-1_battery_voltage') %}
          {% set rb = states('input_number.dump_rebulk_inverter-1-v') %}
          {{ is_number(v) and is_number(rb) and (v | float) <= (rb | float) }}
      - name: Dump Sungold voltage guard active
        unique_id: dump_inverter-1-vguard
        default_entity_id: binary_sensor.dump_inverter-1-vguard
        icon: mdi:battery-heart-outline
        # On when the guard is enabled and Sungold volts are under the floor helper,
        # or under the lower live T2/KU shunt by the margin helper. While already on,
        # both tests stay tripped until the voltage recovers by the hysteresis helper
        # (`this.state`). Off when the guard is disabled or Sungold volts are missing.
        state: >
          {% set enabled = is_state('input_boolean.dump_inverter-1-vguard_enabled', 'on') %}
          {% set raw_v = states('sensor.sungold-inverter-1_battery_voltage') %}
          {% set raw_t2 = states('sensor.battery_1_voltage') %}
          {% set raw_ku = states('sensor.battery_2_voltage') %}
          {% set raw_floor = states('input_number.dump_inverter-1-vguard_floor_v') %}
          {% set raw_margin = states('input_number.dump_inverter-1-vguard_margin_v') %}
          {% set raw_hyst = states('input_number.dump_inverter-1-vguard_hysteresis_v') %}
          {% if not enabled or not is_number(raw_v) or not is_number(raw_floor) or not is_number(raw_margin) or not is_number(raw_hyst) %}
            off
          {% else %}
            {% set sv = raw_v | float %}
            {% set floor = raw_floor | float %}
            {% set margin = raw_margin | float %}
            {% set hyst = raw_hyst | float %}
            {% set refs = [] %}
            {% if is_number(raw_t2) %}{% set refs = refs + [raw_t2 | float] %}{% endif %}
            {% if is_number(raw_ku) %}{% set refs = refs + [raw_ku | float] %}{% endif %}
            {% set low = (refs | min) if refs else none %}
            {% set was = this is defined and this.state is defined and this.state == 'on' %}
            {% set lift = hyst if was else 0 %}
            {% set floor_hit = sv < (floor + lift) %}
            {% set rel_hit = low is not none and sv < (low - margin + lift) %}
            {{ 'on' if floor_hit or rel_hit else 'off' }}
          {% endif %}
        attributes:
          sungold_v: "{{ states('sensor.sungold-inverter-1_battery_voltage') }}"
          battery-2-v: "{{ states('sensor.battery_1_voltage') }}"
          battery-1-v: "{{ states('sensor.battery_2_voltage') }}"
          ref_v: >-
            {% set raw_t2 = states('sensor.battery_1_voltage') %}
            {% set raw_ku = states('sensor.battery_2_voltage') %}
            {% set refs = [] %}
            {% if is_number(raw_t2) %}{% set refs = refs + [raw_t2 | float] %}{% endif %}
            {% if is_number(raw_ku) %}{% set refs = refs + [raw_ku | float] %}{% endif %}
            {% if refs %}{{ refs | min }}{% else %}none{% endif %}
          reason: >-
            {% set enabled = is_state('input_boolean.dump_inverter-1-vguard_enabled', 'on') %}
            {% set raw_v = states('sensor.sungold-inverter-1_battery_voltage') %}
            {% set raw_t2 = states('sensor.battery_1_voltage') %}
            {% set raw_ku = states('sensor.battery_2_voltage') %}
            {% set raw_floor = states('input_number.dump_inverter-1-vguard_floor_v') %}
            {% set raw_margin = states('input_number.dump_inverter-1-vguard_margin_v') %}
            {% set raw_hyst = states('input_number.dump_inverter-1-vguard_hysteresis_v') %}
            {% if not enabled %}
              disabled
            {% elif not is_number(raw_v) or not is_number(raw_floor) or not is_number(raw_margin) or not is_number(raw_hyst) %}
              sungold voltage unavailable
            {% else %}
              {% set sv = raw_v | float %}
              {% set floor = raw_floor | float %}
              {% set margin = raw_margin | float %}
              {% set hyst = raw_hyst | float %}
              {% set refs = [] %}
              {% if is_number(raw_t2) %}{% set refs = refs + [raw_t2 | float] %}{% endif %}
              {% if is_number(raw_ku) %}{% set refs = refs + [raw_ku | float] %}{% endif %}
              {% set low = (refs | min) if refs else none %}
              {% set was = this is defined and this.state is defined and this.state == 'on' %}
              {% set lift = hyst if was else 0 %}
              {% set floor_hit = sv < (floor + lift) %}
              {% set rel_hit = low is not none and sv < (low - margin + lift) %}
              {% if floor_hit and rel_hit %}
                below floor and below T2/KU minus margin
              {% elif floor_hit %}
                below floor
              {% elif rel_hit %}
                below T2/KU minus margin
              {% else %}
                clear
              {% endif %}
            {% endif %}
      # Dump status card (site-solar). These rows do not use device_class problem.
      # Other rows mirror the gate sensors above. PV falling IS the gate:
      # dump_turn_on requires this sensor off.
      # On only while the surplus derivative is below -5 W/min, solar is
      # present, and the KU SmartSolar 100/50 is not already in absorption or float.
      # T2 has no charger, so it is not part of this test.
      # No this.state latch. -5 is a noise band, not threshold hysteresis.
      # https://www.home-assistant.io/integrations/template/#binary-sensor
      # https://www.home-assistant.io/integrations/derivative/
      - name: Dump status PV falling
        unique_id: dump_status_pv_falling
        default_entity_id: binary_sensor.dump_status_pv_falling
        state: >
          {% set raw = states('sensor.dump_surplus_derivative') %}
          {% set falling = is_number(raw) and (raw | float) < -5 %}
          {% set solar = is_state('binary_sensor.dump_solar_present', 'on') %}
          {% set banks_full = is_state('binary_sensor.dump_battery-1-charger_float', 'on') %}
          {{ falling and solar and not banks_full }}
        attributes:
          derivative_w_per_min: "{{ states('sensor.dump_surplus_derivative') }}"
          solar_present: "{{ is_state('binary_sensor.dump_solar_present', 'on') }}"
          banks_full: "{{ is_state('binary_sensor.dump_battery-1-charger_float', 'on') }}"
          reason: >
            {% set raw = states('sensor.dump_surplus_derivative') %}
            {% set falling = is_number(raw) and (raw | float) < -5 %}
            {% set solar = is_state('binary_sensor.dump_solar_present', 'on') %}
            {% set banks_full = is_state('binary_sensor.dump_battery-1-charger_float', 'on') %}
            {% if not is_number(raw) %}
              derivative unavailable
            {% elif not falling %}
              derivative at or above -5 W/min
            {% elif not solar %}
              solar not present
            {% elif banks_full %}
              KU charger already in absorption or float (T2 has no charger)
            {% else %}
              surplus falling while solar is present and the banks are not both full
            {% endif %}
      - name: Dump status site charger stage
        unique_id: dump_status_site_charger_stage
        default_entity_id: binary_sensor.dump_status_site_charger_stage
        state: "{{ not is_state('binary_sensor.dump_charge_float', 'on') }}"
      - name: Dump status site solar
        unique_id: dump_status_site_solar
        default_entity_id: binary_sensor.dump_status_site_solar
        state: "{{ not is_state('binary_sensor.dump_solar_present', 'on') }}"
      - name: Dump status site SoC
        unique_id: dump_status_site_soc
        default_entity_id: binary_sensor.dump_status_site_soc
        state: "{{ not is_state('binary_sensor.dump_soc_ok', 'on') }}"
      - name: Dump status Victron stage shed
        unique_id: dump_status_victron_stage_shed
        default_entity_id: binary_sensor.dump_status_victron_stage_shed
        state: "{{ not is_state('binary_sensor.dump_charge_ok', 'on') }}"
      - name: Dump status T2 stage
        unique_id: dump_status_battery-2-stage
        default_entity_id: binary_sensor.dump_status_battery-2-stage
        state: "{{ not is_state('binary_sensor.dump_battery-2-charger_float', 'on') }}"
      - name: Dump status T2 start volts
        unique_id: dump_status_battery-2-start_volts
        default_entity_id: binary_sensor.dump_status_battery-2-start_volts
        state: "{{ not is_state('binary_sensor.dump_v_float_t2', 'on') }}"
      - name: Dump status T2 battery
        unique_id: dump_status_battery-2-battery
        default_entity_id: binary_sensor.dump_status_battery-2-battery
        state: "{{ not is_state('binary_sensor.dump_batt_battery-2-ok', 'on') }}"
      - name: Dump status KU stage
        unique_id: dump_status_battery-1-stage
        default_entity_id: binary_sensor.dump_status_battery-1-stage
        state: "{{ not is_state('binary_sensor.dump_battery-1-charger_float', 'on') }}"
      - name: Dump status KU start volts
        unique_id: dump_status_battery-1-start_volts
        default_entity_id: binary_sensor.dump_status_battery-1-start_volts
        state: "{{ not is_state('binary_sensor.dump_v_float_ku', 'on') }}"
      - name: Dump status KU battery
        unique_id: dump_status_battery-1-battery
        default_entity_id: binary_sensor.dump_status_battery-1-battery
        state: "{{ not is_state('binary_sensor.dump_batt_battery-1-ok', 'on') }}"
      - name: Dump status Sungold start volts
        unique_id: dump_status_inverter-1-start_volts
        default_entity_id: binary_sensor.dump_status_inverter-1-start_volts
        state: "{{ not is_state('binary_sensor.dump_v_float_sph', 'on') }}"
      - name: Dump status Sungold battery
        unique_id: dump_status_inverter-1-battery
        default_entity_id: binary_sensor.dump_status_inverter-1-battery
        state: "{{ not is_state('binary_sensor.dump_batt_inverter-1-ok', 'on') }}"
      - name: Sungold charge needed
        unique_id: inverter-1-charge_need
        default_entity_id: binary_sensor.inverter-1-charge_need
        icon: mdi:battery-charging-low
        # Inlet on is the T2 Absorption/Float path (inverter-1-charge_banks_feed).
        # A low Sungold pack does not turn the inlet on.
        state: "{{ 'off' }}"
      - name: Sungold charge inlet dark
        unique_id: inverter-1-charge_inlet_dark
        default_entity_id: binary_sensor.inverter-1-charge_inlet_dark
        icon: mdi:power-plug-off
        # A Sungold charge socket is on, and the sidecar reports numbers, but the
        # inlet is not energized: grid at or below 0 with charging power at or below
        # 5 W. Grid voltage that is present means Sungold is waiting on its own
        # charge settings, so this stays off. Missing or unknown sidecar values
        # stay off. This does not turn the socket off. The alert waits 3 minutes.
        state: >
          {% set ns = namespace(on=false) %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
            {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
               and is_state('switch.ihoment_plug_' ~ s, 'on') %}
              {% set ns.on = true %}
            {% endif %}
          {% endfor %}
          {% set gv = states('sensor.sungold-inverter-1_grid_voltage') %}
          {% set cp = states('sensor.sungold-inverter-1_charging_power') %}
          {% if not ns.on or not is_number(gv) or not is_number(cp) %}
            off
          {% else %}
            {{ 'on' if (gv | float) <= 0 and (cp | float) <= 5 else 'off' }}
          {% endif %}
      - name: Sungold charge source stop
        unique_id: inverter-1-charge_source_stop
        default_entity_id: binary_sensor.inverter-1-charge_source_stop
        icon: mdi:battery-arrow-down
        # On when a Sungold charge socket is on and its feeding bank is at or under
        # that bank's re-bulk stop (T2 or KU). Hold is applied by the turn-off automation.
        state: >
          {% set ns = namespace(hit=false) %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
            {% set bus = states('input_select.plug_' ~ s ~ '_inverter') %}
            {% set low = is_state('binary_sensor.dump_v_rebulk_t2', 'on') if bus == 'T2' else (is_state('binary_sensor.dump_v_rebulk_ku', 'on') if bus == 'KU' else false) %}
            {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
               and (bus == 'T2' or bus == 'KU')
               and is_state('switch.ihoment_plug_' ~ s, 'on')
               and low %}
              {% set ns.hit = true %}
            {% endif %}
          {% endfor %}
          {{ 'on' if ns.hit else 'off' }}

      - name: Sungold charge banks can feed
        unique_id: inverter-1-charge_banks_feed
        default_entity_id: binary_sensor.inverter-1-charge_banks_feed
        icon: mdi:solar-power
        # T2 charger is in Absorption or Float and T2 is above its re-bulk stop.
        # Panel watts are not the test: a full charger holds the panels back.
        # The inlet stays on from this even when Sungold is full.
        # https://www.victronenergy.com/media/pg/Manual_SmartSolar_MPPT_100-30__100-50/en/features.html
        state: >
          {{ is_state('binary_sensor.dump_battery-2-charger_float', 'on')
             and not is_state('binary_sensor.dump_v_rebulk_t2', 'on') }}
      - name: Sungold charge surplus ready
        unique_id: inverter-1-charge_surplus_ready
        default_entity_id: binary_sensor.inverter-1-charge_surplus_ready
        icon: mdi:transmission-tower
        # Rescue is off, and at least one Sungold charge socket can take spare
        # solar from a feeding charger that is in Absorption or Float and above
        # that bank's re-bulk stop. Charge watts are not the test. Defers while
        # the dump master is on and a dump socket is still next.
        state: >
          {% set defer = is_state('input_boolean.dump_control_enabled', 'on')
             and states('sensor.dump_next_plug').startswith('switch.ihoment_plug_') %}
          {% set ns = namespace(hit=false) %}
          {% if is_state('input_boolean.inverter-1-charge_enabled', 'on')
             and not is_state('binary_sensor.inverter-1-charge_need', 'on')
             and not defer %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% set bus = states('input_select.plug_' ~ s ~ '_inverter') %}
              {% set rawp = states('sensor.battery_1_power') if bus == 'T2' else states('sensor.battery_2_power') %}
              {% set minw = states('input_number.inverter-1-charge_surplus_min_w') %}
              {% set rawv = states('sensor.sungold-inverter-1_battery_voltage') %}
              {% set full = states('input_number.inverter-1-charge_full_v') %}
              {% set bank = namespace(ok=false) %}
              {% if bus == 'T2' %}
                {% set bank.ok = is_state('binary_sensor.dump_battery-2-charger_float', 'on')
                   and not is_state('binary_sensor.dump_v_rebulk_t2', 'on') %}
              {% elif bus == 'KU' %}
                {% set bank.ok = is_state('binary_sensor.dump_battery-1-charger_float', 'on')
                   and not is_state('binary_sensor.dump_v_rebulk_ku', 'on') %}
              {% endif %}
              {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
                 and is_state('switch.ihoment_plug_' ~ s, 'off')
                 and states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused']
                 and is_state('timer.plug_' ~ s ~ '_cooldown', 'idle')
                 and bank.ok %}
                {% set ns.hit = true %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ 'on' if ns.hit else 'off' }}
      - name: Sungold charge surplus stop
        unique_id: inverter-1-charge_surplus_stop
        default_entity_id: binary_sensor.inverter-1-charge_surplus_stop
        icon: mdi:transmission-tower-off
        # A Sungold charge socket is on, rescue is off, its min-on timer is idle,
        # and its feeding charger is no longer in Absorption or Float above
        # that bank's re-bulk stop. Full Sungold volts do not turn the inlet off
        # while the feeding charger is still in Absorption or Float.
        state: >
          {% set ns = namespace(hit=false) %}
          {% if is_state('input_boolean.inverter-1-charge_enabled', 'on')
             and not is_state('binary_sensor.inverter-1-charge_need', 'on') %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% set bus = states('input_select.plug_' ~ s ~ '_inverter') %}
              {% set rawp = states('sensor.battery_1_power') if bus == 'T2' else states('sensor.battery_2_power') %}
              {% set minw = states('input_number.inverter-1-charge_surplus_min_w') %}
              {% set bank = namespace(ok=false) %}
              {% if bus == 'T2' %}
                {% set bank.ok = is_state('binary_sensor.dump_battery-2-charger_float', 'on')
                   and not is_state('binary_sensor.dump_v_rebulk_t2', 'on') %}
              {% elif bus == 'KU' %}
                {% set bank.ok = is_state('binary_sensor.dump_battery-1-charger_float', 'on')
                   and not is_state('binary_sensor.dump_v_rebulk_ku', 'on') %}
              {% endif %}
              {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
                 and (bus == 'T2' or bus == 'KU')
                 and is_state('switch.ihoment_plug_' ~ s, 'on')
                 and (states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on'))
                 and states('timer.plug_' ~ s ~ '_min_on') not in ['active', 'paused']
                 and not bank.ok %}
                {% set ns.hit = true %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ 'on' if ns.hit else 'off' }}

sensor:
  - platform: derivative
    source: sensor.dump_surplus_w
    name: Dump surplus derivative
    unique_id: dump_surplus_derivative
    round: 1
    unit_time: min
    time_window: "00:15:00"

binary_sensor:
  - platform: threshold
    entity_id: sensor.dump_surplus_w
    name: Dump surplus high
    upper: 125
    hysteresis: 75
  # PV falling is not this helper. With only lower set, the threshold binary
  # sensor turns on below (lower - hysteresis) and turns off only above
  # (lower + hysteresis). A value in between keeps the last state, so a full
  # bank latches "on" for the rest of the afternoon.
  # https://www.home-assistant.io/integrations/threshold/
  # The gate is template binary_sensor.dump_status_pv_falling.

automation victron_charger_preset:
  - id: victron_float_writes_battery-2-battery-1-dump_volts
    alias: "Victron float writes T2 and KU start and stop"
    description: >
      One Victron float box writes dump_float_battery-2-v and dump_float_battery-1-v.
      Stop is that float minus 0.2 V. The SmartSolar operation chapter says
      LiFePO4 re-bulk is Vfloat minus 0.1 V for 12 V, multiplied by two for 24 V.
      Absorption is stored and does not write these. Also runs when Home
      Assistant starts so the helpers cannot drift. Sungold dump volts are
      not written here.
      https://www.victronenergy.com/media/pg/Manual_SmartSolar_MPPT_100-30__100-50/en/operation.html
      https://www.victronenergy.com/media/pg/Manual_SmartSolar_MPPT_100-30__100-50/en/configuration-and-settings.html
      https://www.home-assistant.io/integrations/input_number/
      https://www.home-assistant.io/docs/automation/trigger/
      https://www.home-assistant.io/triggers/homeassistant/
      https://www.home-assistant.io/actions/input_number.set_value/
      https://www.home-assistant.io/docs/automation/modes/
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_number.victron_float_v
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ is_number(states('input_number.victron_float_v')) }}"
    actions:
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_float_battery-2-v
            - input_number.dump_float_battery-1-v
        data:
          value: "{{ states('input_number.victron_float_v') | float }}"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.dump_rebulk_battery-2-v
            - input_number.dump_rebulk_battery-1-v
        data:
          value: "{{ (states('input_number.victron_float_v') | float - 0.2) | round(2) }}"

automation dump_load:
  - id: dump_turn_on
    alias: "Dump ON: add dump sockets while the charger is in float"
    description: >
      Adds one dump socket at a time. Starts when a Victron is in float or Sungold is at
      start volts for 1 min, and T2 100/50, KU 75/15, or Sungold PV has been at or
      above "Dump min solar" for 1 min, the master
      switch is on, SoC is ok (or ignored), the PV falling blocker is off and Sungold load is not
      above solar. sensor.dump_next_plug picks the first OFF dump socket (Use dump,
      Inverter not House) whose cooldown is idle, when some measured bus is at or
      above its start volts and above its stop volts, that bus battery is not
      discharging past its limit, and that bus is under its AC limit. The inverter
      label is not the decider. After the plug reports on, waits "Dump confirm wait"
      and keeps it when a healthy bus meter rose by "Dump confirm min load rise".
      A rise only on a bus at or under stop, or past its discharge limit, turns it
      off. A plug that reports on with no watt rise stays on and the next
      socket is tried. A plug that does not report on takes the 10 minute cooldown
      so the next socket is tried. Each step writes the reason to the logbook
      ("Dump control").
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.dump_charge_float
        to: "on"
        for: "00:01:00"
      - trigger: state
        entity_id: binary_sensor.dump_solar_present
        to: "on"
        for: "00:01:00"
      - trigger: state
        entity_id: sensor.dump_next_plug
    conditions:
      - condition: state
        entity_id: input_boolean.dump_control_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.dump_charge_float
        state: "on"
        for:
          minutes: 1
      - condition: state
        entity_id: binary_sensor.dump_solar_present
        state: "on"
        for:
          minutes: 1
      - condition: template
        value_template: >
          {{ not is_state('binary_sensor.dump_status_pv_falling', 'on') }}
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.dump_load_exceeds_solar
            state: "on"
      - condition: template
        value_template: "{{ states('sensor.dump_next_plug').startswith('switch.ihoment_plug_') }}"
    actions:
      - repeat:
          while:
            - condition: state
              entity_id: input_boolean.dump_control_enabled
              state: "on"
            - condition: state
              entity_id: binary_sensor.dump_charge_float
              state: "on"
            - condition: state
              entity_id: binary_sensor.dump_solar_present
              state: "on"
            - condition: template
              value_template: >
                {{ not is_state('binary_sensor.dump_status_pv_falling', 'on') }}
            - condition: not
              conditions:
                - condition: state
                  entity_id: binary_sensor.dump_load_exceeds_solar
                  state: "on"
            - condition: template
              value_template: "{{ states('sensor.dump_next_plug').startswith('switch.ihoment_plug_') and repeat.index <= 16 }}"
          sequence:
            - variables:
                target: "{{ states('sensor.dump_next_plug') }}"
                sock: "{{ states('sensor.dump_next_plug') | replace('switch.ihoment_plug_', '') }}"
            - variables:
                battery-2-before: "{{ states('sensor.dump_bus_load_t2') | float if is_number(states('sensor.dump_bus_load_t2')) else none }}"
                battery-1-before: "{{ states('sensor.dump_bus_load_ku') | float if is_number(states('sensor.dump_bus_load_ku')) else none }}"
                inverter-1-before: "{{ states('sensor.sungold-inverter-1_load_power') | float if is_number(states('sensor.sungold-inverter-1_load_power')) else none }}"
            - condition: template
              value_template: "{{ (is_state('input_select.plug_' ~ sock ~ '_use', 'dump') and not is_state('input_select.plug_' ~ sock ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ sock.split('_')[0] ~ '_online', 'on')) and states('timer.plug_' ~ sock ~ '_hold') not in ['active', 'paused'] }}"
            # Live name for the logbook line: the socket's Load text and its plug's
            # Where text (input_text helpers you set in HA), else the plug id + side.
            # Nothing about what is plugged in is hard-coded here. Reused below.
            - &socket_label
              variables:
                label: >-
                  {%- set b = ['', 'unknown', 'unavailable', 'none'] -%}
                  {%- set p = sock[:4] -%}
                  {%- set tag = p | upper ~ ' ' ~ sock[5:] -%}
                  {%- set l = states('input_text.plug_' ~ sock ~ '_load') | trim -%}
                  {%- set w = states('input_text.plug_' ~ p ~ '_location') | trim -%}
                  {{ (l ~ ' (' ~ tag ~ ')') if l not in b else tag }}{{ (' at ' ~ w) if w not in b else '' }}
            - action: logbook.log
              data:
                name: Dump control
                entity_id: "{{ target }}"
                message: >-
                  {{ label }}: turning ON from measured bus headroom: T2 {{ states('sensor.battery_1_voltage') }} V / {{ battery-2-before }} W, KU {{ states('sensor.battery_2_voltage') }} V / {{ battery-1-before }} W, Sungold {{ states('sensor.sungold-inverter-1_battery_voltage') }} V / {{ inverter-1-before }} W.
                  {% if is_state('input_boolean.dump_skip_cooldown', 'on') %}Skip cooldown was on, so an active cooldown did not block this socket. The skip switch is now off.{% endif %}
            - if:
                - condition: state
                  entity_id: input_boolean.dump_skip_cooldown
                  state: "on"
              then:
                - action: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.dump_skip_cooldown
            - if:
                - condition: template
                  value_template: "{{ not is_state('input_boolean.plug_' ~ sock ~ '_held_by_you', 'on') }}"
              then:
              - event: dump_control_switching
                event_data:
                  sock: "{{ sock }}"
                  state: "on"
              - action: switch.turn_on
                target:
                  entity_id: "{{ target }}"
            # The H5082 state only turns on after the plug acks over BLE (connect +
            # login + retries on a cold link). Start the site confirm from there.
            - wait_template: "{{ is_state(target, 'on') }}"
              timeout: "00:02:00"
              continue_on_timeout: true
            - variables:
                switched: "{{ wait.completed }}"
            - delay: "{{ states('input_number.dump_site_confirm_s') | int(5) }}"
            - variables:
                battery-2-after: "{{ states('sensor.dump_bus_load_t2') | float if is_number(states('sensor.dump_bus_load_t2')) else none }}"
                battery-1-after: "{{ states('sensor.dump_bus_load_ku') | float if is_number(states('sensor.dump_bus_load_ku')) else none }}"
                inverter-1-after: "{{ states('sensor.sungold-inverter-1_load_power') | float if is_number(states('sensor.sungold-inverter-1_load_power')) else none }}"
            - variables:
                confirm_kind: >
                  {% set need = states('input_number.dump_site_delta_min_w') | float(25) %}
                  {% set battery-2-rose = is_number(battery-2-before) and is_number(battery-2-after) and ((battery-2-after | float) - (battery-2-before | float)) >= need %}
                  {% set battery-1-rose = is_number(battery-1-before) and is_number(battery-1-after) and ((battery-1-after | float) - (battery-1-before | float)) >= need %}
                  {% set inverter-1-rose = is_number(inverter-1-before) and is_number(inverter-1-after) and ((inverter-1-after | float) - (inverter-1-before | float)) >= need %}
                  {% set battery-2-ok = is_state('binary_sensor.dump_v_rebulk_t2', 'off') and is_state('binary_sensor.dump_batt_battery-2-ok', 'on') and is_state('binary_sensor.dump_v_float_t2', 'on') %}
                  {% set battery-1-ok = is_state('binary_sensor.dump_v_rebulk_ku', 'off') and is_state('binary_sensor.dump_batt_battery-1-ok', 'on') and is_state('binary_sensor.dump_v_float_ku', 'on') %}
                  {% set inverter-1-ok = is_state('binary_sensor.dump_v_rebulk_sph', 'off') and is_state('binary_sensor.dump_batt_inverter-1-ok', 'on') and is_state('binary_sensor.dump_v_float_sph', 'on') and is_state('binary_sensor.dump_inverter-1-vguard', 'off') %}
                  {% if not switched %}
                    none
                  {% elif (battery-2-rose and battery-2-ok) or (battery-1-rose and battery-1-ok) or (inverter-1-rose and inverter-1-ok) %}
                    healthy
                  {% elif (battery-2-rose and not battery-2-ok) or (battery-1-rose and not battery-1-ok) or (inverter-1-rose and not inverter-1-ok) %}
                    trouble
                  {% else %}
                    none
                  {% endif %}
                rise: >-
                  {% set ns = namespace(p=[]) %}
                  {% if is_number(battery-2-before) and is_number(battery-2-after) %}{% set ns.p = ns.p + ['T2 ' ~ ((battery-2-after | float - battery-2-before | float) | round(1))] %}{% endif %}
                  {% if is_number(battery-1-before) and is_number(battery-1-after) %}{% set ns.p = ns.p + ['KU ' ~ ((battery-1-after | float - battery-1-before | float) | round(1))] %}{% endif %}
                  {% if is_number(inverter-1-before) and is_number(inverter-1-after) %}{% set ns.p = ns.p + ['Sungold ' ~ ((inverter-1-after | float - inverter-1-before | float) | round(1))] %}{% endif %}
                  {{ ns.p | join(', ') if ns.p else 'unknown' }}
            - if:
                - condition: template
                  value_template: >
                    {{ not is_state('binary_sensor.dump_charge_float', 'on')
                       or not is_state('binary_sensor.dump_solar_present', 'on') }}
              then:
                - if:
                    - condition: template
                      value_template: "{{ not is_state('input_boolean.plug_' ~ sock ~ '_held_by_you', 'on') }}"
                  then:
                  - event: dump_control_switching
                    event_data:
                      sock: "{{ sock }}"
                      state: "off"
                  - action: switch.turn_off
                    target:
                      entity_id: "{{ target }}"
                - action: timer.start
                  target:
                    entity_id: "timer.plug_{{ sock }}_cooldown"
                - action: timer.cancel
                  target:
                    entity_id: "timer.plug_{{ sock }}_min_on"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "{{ target }}"
                    message: >-
                      {{ label }}: turned back OFF: charger left float or solar went away during the
                      confirm wait. Cooldown 10 min. Staging stopped.
                - stop: left float or solar gone
            - if:
                - condition: template
                  value_template: "{{ confirm_kind == 'trouble' }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ not is_state('input_boolean.plug_' ~ sock ~ '_held_by_you', 'on') }}"
                  then:
                  - event: dump_control_switching
                    event_data:
                      sock: "{{ sock }}"
                      state: "off"
                  - action: switch.turn_off
                    target:
                      entity_id: "{{ target }}"
                - action: timer.start
                  target:
                    entity_id: "timer.plug_{{ sock }}_cooldown"
                - action: timer.cancel
                  target:
                    entity_id: "timer.plug_{{ sock }}_min_on"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "{{ target }}"
                    message: >-
                      {{ label }}: turned OFF: watt rise was on a bus at or under stop or past its discharge limit ({{ rise }} W). Cooldown 10 min.
                - delay: 1
            - if:
                - condition: template
                  value_template: "{{ confirm_kind == 'none' }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ not switched }}"
                  then:
                    - action: timer.start
                      target:
                        entity_id: "timer.plug_{{ sock }}_cooldown"
                    - *socket_label
                    - action: logbook.log
                      data:
                        name: Dump control
                        entity_id: "{{ target }}"
                        message: >-
                          {{ label }}: did not report on within 2 minutes. Cooldown 10 min, trying the next dump until a watt rise is seen.
                    - delay: 1
                  else:
                    - *socket_label
                    - action: logbook.log
                      data:
                        name: Dump control
                        entity_id: "{{ target }}"
                        message: >-
                          {{ label }}: on but no watt rise ({{ rise }} W). Leaving the switch on and trying the next dump.
                    - delay: 1
              else:
                - action: timer.start
                  target:
                    entity_id: "timer.plug_{{ sock }}_min_on"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "{{ target }}"
                    message: >-
                      {{ label }}: kept ON: a bus still above stop and inside its discharge limit rose ({{ rise }} W).
                - delay: 1
                - stop: measured load on this dump

  - id: dump_turn_off_solar_gone
    alias: "Dump OFF all: solar gone for 1 minute"
    description: >
      T2 MPPT PV below "Dump min solar" for 1 min (weather or end of day). Every dump
      socket that is not already off is turned off, its min-on cancelled and its cooldown
      started, so dump sockets never run as night loads (95%+ left in the packs).
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.dump_solar_present
        to: "off"
        for: "00:01:00"
    conditions:
      - condition: state
        entity_id: input_boolean.dump_control_enabled
        state: "on"
    actions:
      - variables:
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% if (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on')) and (states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on'))
                 and not is_state('switch.ihoment_plug_' ~ s, 'off') %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ not is_state('input_boolean.plug_' ~ repeat.item ~ '_held_by_you', 'on') }}"
              then:
              - event: dump_control_switching
                event_data:
                  sock: "{{ repeat.item }}"
                  state: "off"
              - action: switch.turn_off
                target:
                  entity_id: "switch.ihoment_plug_{{ repeat.item }}"
            - action: timer.cancel
              target:
                entity_id: "timer.plug_{{ repeat.item }}_min_on"
            - action: timer.start
              target:
                entity_id: "timer.plug_{{ repeat.item }}_cooldown"
            - variables:
                sock: "{{ repeat.item }}"
            - *socket_label
            - action: logbook.log
              data:
                name: Dump control
                entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                message: >-
                  {{ label }}: turned OFF by "Dump OFF all: solar gone for 1 minute": site PV below Dump min solar {{ states('input_number.dump_min_solar_w') }} W for 1 min. Cooldown 10 min.

  - id: dump_turn_off_bulk
    alias: "Dump SHED one per minute: T2 charger left absorption/float"
    description: >
      T2 MPPT charge state not absorption or float for 1 min (clouds or a big load pulled
      it back to bulk). Sheds one dump socket per minute, last in the stage order first,
      until float returns or no dump socket is on. Not all at once, so the MPPT is not
      forced into a same-day float-idle cycle. Night/storm all-off is the solar-gone rule.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.dump_charge_ok
        to: "off"
        for: "00:01:00"
    conditions:
      - condition: state
        entity_id: input_boolean.dump_control_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.dump_soc_hold_trips
        state: "off"
    actions:
      - repeat:
          while:
            - condition: state
              entity_id: binary_sensor.dump_soc_hold_trips
              state: "off"
            - condition: state
              entity_id: binary_sensor.dump_charge_float
              state: "off"
            - condition: template
              value_template: "{{ states('sensor.dump_shed_plug').startswith('switch.ihoment_plug_') }}"
            - condition: template
              value_template: "{{ repeat.index <= 16 }}"
          sequence:
            - variables:
                target: "{{ states('sensor.dump_shed_plug') }}"
                sock: "{{ states('sensor.dump_shed_plug') | replace('switch.ihoment_plug_', '') }}"
            - if:
                - condition: template
                  value_template: "{{ not is_state('input_boolean.plug_' ~ sock ~ '_held_by_you', 'on') }}"
              then:
              - event: dump_control_switching
                event_data:
                  sock: "{{ sock }}"
                  state: "off"
              - action: switch.turn_off
                target:
                  entity_id: "{{ target }}"
            - action: timer.cancel
              target:
                entity_id: "timer.plug_{{ sock }}_min_on"
            - action: timer.start
              target:
                entity_id: "timer.plug_{{ sock }}_cooldown"
            - *socket_label
            - action: logbook.log
              data:
                name: Dump control
                entity_id: "{{ target }}"
                message: >-
                  {{ label }}: turned OFF by "Dump SHED one per minute: T2 charger left absorption/float": KU SmartSolar 100/50 is {{ states('sensor.victron-mppt-1_battery_state') }} (not absorption or float). T2 has no charger. Next shed in 1 min if still true.
            - delay: "00:01:00"

