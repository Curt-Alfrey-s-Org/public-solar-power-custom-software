                message: >-
                  {{ label }}: turned OFF by "Dump SHED one per minute: Sungold load above solar": Sungold load {{ states('sensor.sungold-inverter-1_load_power') }} W is above KU 100/50 PV {{ states('sensor.victron-mppt-1_solar_power') }} W + Sungold PV {{ states('sensor.sungold-inverter-1_pv_power') }} W. Next shed in 1 min if still true.
            - delay: "00:01:00"

  - id: dump_notify_load_exceeds_solar
    alias: "Dump ALERT: Sungold load above solar for 10 minutes"
    description: >
      Text when Load now (Sungold AC-out) stays above T2 MPPT PV + Sungold PV for 10
      minutes. Always sends notify.persistent_notification; also sends
      notify.<Dump alert notify service> when that helper holds a Companion action
      name (mobile_app_<device>). Runs even when the master switch is off.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.dump_load_exceeds_solar
        to: "on"
        for: "00:10:00"
    actions:
      - variables:
          msg: >
            Load {{ states('sensor.sungold-inverter-1_load_power') }} W has been
            above T2 MPPT plus Sungold PV W for 10 minutes.
          svc: "{{ states('input_text.dump_notify_service') | trim }}"
      - action: notify.persistent_notification
        data:
          title: Solar load above solar
          message: "{{ msg }}"
      - if:
          - condition: template
            value_template: "{{ svc not in ['persistent_notification', '', 'unknown', 'unavailable', 'none'] }}"
        then:
          - action: "notify.{{ svc }}"
            data:
              title: Solar load above solar
              message: "{{ msg }}"

