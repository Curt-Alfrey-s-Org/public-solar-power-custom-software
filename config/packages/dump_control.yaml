  - id: dump_turn_off_batt_t2
    alias: "Dump OFF T2 sockets: T2 battery discharging past limit"
    description: >
      T2 battery discharging more than "Dump T2 max battery discharge" for 1 min (or its
      meter unavailable). The inverter is pulling from the pack, so every dump socket
      that is not already off is turned off, even during min-on. The inverter label is not the filter.
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.dump_batt_battery-2-ok
        to: "off"
        for: "00:01:00"
      - trigger: state
        entity_id: binary_sensor.dump_soc_hold_trips
        to: "off"
    conditions:
      - condition: state
        entity_id: input_boolean.dump_control_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.dump_soc_hold_trips
        state: "off"
      - condition: state
        entity_id: binary_sensor.dump_batt_battery-2-ok
        state: "off"
        for: "00:01:00"
      - condition: state
        entity_id: binary_sensor.dump_solar_present
        state: "off"
      - condition: template
        value_template: >
          {% set sky = states('weather.hygrometer-1') %}
          {% set daytime = sky in ['sunny', 'partlycloudy', 'cloudy', 'windy', 'windy-variant'] %}
          {# No T2 charger. Do not hold T2 sockets because the KU 100/50 is in float. #}
          {{ true }}
    actions:
      - variables:
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% if (is_state('input_select.plug_' ~ s ~ '_use', 'dump') and not is_state('input_select.plug_' ~ s ~ '_inverter', 'House') and is_state('input_boolean.plug_' ~ s.split('_')[0] ~ '_online', 'on')) and (states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on'))
                 and not is_state('switch.ihoment_plug_' ~ s, 'off') %}
                {% set ns.out = ns.out + [s] %}
