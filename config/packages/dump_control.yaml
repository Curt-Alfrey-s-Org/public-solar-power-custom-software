          - switch.plug-1_left
          - switch.plug-1_right
          - switch.plug-2_left
          - switch.plug-2_right
          - switch.plug-3_left
          - switch.plug-3_right
          - switch.plug-4_left
          - switch.plug-4_right
          - switch.plug-5_left
          - switch.plug-5_right
          - switch.plug-6_left
          - switch.plug-6_right
          - switch.plug-7_left
          - switch.plug-7_right
          - switch.plug-8_left
          - switch.plug-8_right
        to: "on"
    actions:
      - condition: template
        value_template: >
          {% set ns = namespace(on=false) %}
          {% for s in [
            'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
            'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
            'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
          ] %}
            {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
               and states('input_select.plug_' ~ s ~ '_inverter') in ['T2', 'KU']
               and is_state('switch.ihoment_plug_' ~ s, 'on') %}
              {% set ns.on = true %}
            {% endif %}
          {% endfor %}
          {{ (not is_state('binary_sensor.dump_inverter-1-vguard', 'on')) or ns.on }}
      - action: persistent_notification.dismiss
        data:
          notification_id: sungold_vguard_inlet_off

  - id: dump_remember_solar_before_float
    alias: "Dump remember solar watts before float"
    description: >
      Keeps the higher KU SmartSolar 100/50 solar watts seen while that charger
      is producing. The BlueSolar 75/15 chargers are unused. A later drop into float does not lower the number.
      Clears it at 20:00 local time and when weather.hygrometer-1 is clear-night.
      sun.sun is not required. See docs/site-solar/dump-start-conditions.md.
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id:
          - sensor.victron-mppt-1_solar_power
      - trigger: time
        at: "20:00:00"
      - trigger: state
        entity_id: weather.hygrometer-1
        to: "clear-night"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.platform == 'time'
                     or (trigger.entity_id == 'weather.hygrometer-1'
                         and trigger.to_state.state == 'clear-night') }}
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.dump_solar_before_float_w
                data:
                  value: 0
        default:
          - action: input_number.set_value
            target:
              entity_id: input_number.dump_solar_before_float_w
            data:
              value: >
                {% set cur = states('input_number.dump_solar_before_float_w') | float(0) %}
                {% set ss = states('sensor.victron-mppt-1_solar_power') | float(0) %}
                {{ [cur, ss] | max }}

  - id: dump_inverter-1-charge_on
    alias: "Dump ON Sungold charge sockets: pack is low"
    description: >
      Sungold charge is enabled and the pack has stayed low for the dwell helper,
      under the floor, under the lower of the live T2 and KU volts by the margin,
      or under the optional SoC. The voltage guard is not a reason to charge.
      Turns on each socket whose Use is Sungold charge and whose Inverter helper
      is T2 or KU when that bank is at the source minimum, the socket is off and
      not on hold. Rescue ignores cooldown so a surplus off cannot block a low pack.
      Home Assistant start and a one minute poll re-check a need that is already on.
      Fires dump_control_switching first so a hand tap is still a hold. Sends ON
      once and waits up to 3 minutes for the plug to report on; only then starts
      the min-on timer. No report raises a Plug did not switch notification.
      Skips held-by-you sockets. Does not use the dump master switch and does not
      switch dump sockets.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.inverter-1-charge_need
        to: "on"
        for:
          seconds: "{{ states('input_number.inverter-1-charge_dwell_s') | int(0) }}"
      - trigger: state
        entity_id:
          - sensor.battery_1_voltage
          - sensor.battery_2_voltage
          - sensor.battery_1_state_of_charge
          - sensor.battery_2_state_of_charge
      - trigger: state
        entity_id: input_boolean.inverter-1-charge_enabled
        to: "on"
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.inverter-1-charge_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.inverter-1-charge_need
        state: "on"
        for:
          seconds: "{{ states('input_number.inverter-1-charge_dwell_s') | int(0) }}"
    actions:
      - variables:
          feed_load: >
            {% set load = states('sensor.sungold-inverter-1_load_power') | float(0) %}
            {% set minw = states('input_number.dump_min_solar_w') | float(50) %}
            {{ is_state('binary_sensor.dump_solar_present', 'on') and (load >= minw) }}
      - variables:
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% set bus = states('input_select.plug_' ~ s ~ '_inverter') %}
              {% set rawv = states('sensor.battery_1_voltage') if bus == 'T2' else (states('sensor.battery_2_voltage') if bus == 'KU' else 'none') %}
              {% set rawsoc = states('sensor.battery_1_state_of_charge') if bus == 'T2' else (states('sensor.battery_2_state_of_charge') if bus == 'KU' else 'none') %}
              {% set vmin = states('input_number.inverter-1-charge_source_min_v') %}
              {% set healthy = is_number(rawv) and is_number(vmin) and (rawv | float) >= (vmin | float) %}
              {% if is_state('input_boolean.inverter-1-charge_source_soc_enabled', 'on') %}
                {% set sm = states('input_number.inverter-1-charge_source_min_soc') %}
                {% set healthy = healthy and is_number(rawsoc) and is_number(sm) and (rawsoc | float) >= (sm | float) %}
              {% endif %}
              {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
                 and (bus == 'T2' or bus == 'KU')
                 and is_state('switch.ihoment_plug_' ~ s, 'off')
                 and (states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused'] or feed_load | bool)
                 and healthy %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ is_state('switch.ihoment_plug_' ~ repeat.item, 'off') and (states('timer.plug_' ~ repeat.item ~ '_hold') not in ['active', 'paused'] or feed_load | bool) and not is_state('input_boolean.plug_' ~ repeat.item ~ '_held_by_you', 'on') }}"
              then:
                - event: dump_control_switching
                  event_data:
                    sock: "{{ repeat.item }}"
                    state: "on"
                - action: switch.turn_on
                  target:
                    entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                - wait_template: "{{ is_state('switch.ihoment_plug_' ~ repeat.item, 'on') }}"
                  timeout: "00:03:00"
                  continue_on_timeout: true
                - variables:
                    sock: "{{ repeat.item }}"
                    switched: "{{ wait.completed }}"
                - *socket_label
                - if:
                    - condition: template
                      value_template: "{{ switched }}"
                  then:
                    - action: timer.start
                      target:
                        entity_id: "timer.plug_{{ sock }}_min_on"
                      data:
                        duration: >-
                          {% set n = states('input_number.inverter-1-charge_min_on_s') | int(60) %}
                          {{ '%02d:%02d:%02d' % (n // 3600, (n % 3600) // 60, n % 60) }}
                    - action: logbook.log
                      data:
                        name: Dump control
                        entity_id: "switch.ihoment_plug_{{ sock }}"
                        message: >-
                          {{ label }}: turned ON by "Dump ON Sungold charge sockets: pack is low": Sungold {{ states('sensor.sungold-inverter-1_battery_voltage') }} V, T2 {{ states('sensor.battery_1_voltage') }} V, KU {{ states('sensor.battery_2_voltage') }} V.
                    - action: persistent_notification.dismiss
                      data:
                        notification_id: "plug_no_switch_{{ sock }}"
                  else:
                    - action: logbook.log
                      data:
                        name: Dump control
                        entity_id: "switch.ihoment_plug_{{ sock }}"
                        message: >-
                          {{ label }}: did not turn ON for "Dump ON Sungold charge sockets: pack is low": the plug did not report on within 3 minutes. The next check tries again.
                    - action: persistent_notification.create
                      data:
                        title: Plug did not switch
                        message: >-
                          {{ label }} was told to turn ON (Sungold charge, pack is low) and did not report on within
                          3 minutes. Check the plug and the Pi 4 bridge log. The next check tries again.
                        notification_id: "plug_no_switch_{{ sock }}"

  - id: dump_inverter-1-charge_off
    alias: "Dump OFF Sungold charge sockets: pack recovered"
    description: >
      Sungold charge is enabled and the pack has recovered for the dwell helper,
      which means Sungold volts are at or above the full helper. Turns off Sungold
      charge sockets whose Inverter is T2 or KU after each socket's minimum on time,
      then starts that socket's cooldown. Does not turn a socket off while Sungold
      is still under full volts, so a surplus charge is left to the surplus rule.
      A held socket is skipped only while hold also blocks turn-offs.
      Does not wait out the minimum on time when the feeding bank is under stop volts;
      that is the source-stop rule. Home Assistant start and a one minute poll
      re-check a recovery that is already true. Does not switch dump sockets.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.inverter-1-charge_need
        to: "off"
        for:
          seconds: "{{ states('input_number.inverter-1-charge_dwell_s') | int(0) }}"
      - trigger: state
        entity_id: sensor.sungold-inverter-1_battery_voltage
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id:
          - timer.plug-1_left_min_on
          - timer.plug-1_right_min_on
          - timer.plug-2_left_min_on
          - timer.plug-2_right_min_on
          - timer.plug-3_left_min_on
          - timer.plug-3_right_min_on
          - timer.plug-4_left_min_on
          - timer.plug-4_right_min_on
          - timer.plug-5_left_min_on
          - timer.plug-5_right_min_on
          - timer.plug-6_left_min_on
          - timer.plug-6_right_min_on
          - timer.plug-7_left_min_on
          - timer.plug-7_right_min_on
          - timer.plug-8_left_min_on
          - timer.plug-8_right_min_on
        to: "idle"
    conditions:
      - condition: state
        entity_id: input_boolean.inverter-1-charge_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.inverter-1-charge_need
        state: "off"
        for:
          seconds: "{{ states('input_number.inverter-1-charge_dwell_s') | int(0) }}"
    actions:
      - variables:
          targets: >
            {% set ns = namespace(out=[]) %}
            {% for s in [
              'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
              'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
              'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
            ] %}
              {% set bus = states('input_select.plug_' ~ s ~ '_inverter') %}
              {% set rawv = states('sensor.sungold-inverter-1_battery_voltage') %}
              {% set full = states('input_number.inverter-1-charge_full_v') %}
              {% set at_full = is_number(rawv) and is_number(full) and (rawv | float) >= (full | float) %}
              {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
                 and (bus == 'T2' or bus == 'KU')
                 and is_state('switch.ihoment_plug_' ~ s, 'on')
                 and at_full
                 and not is_state('binary_sensor.inverter-1-charge_banks_feed', 'on')
                 and (states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on')) %}
                {% set ns.out = ns.out + [s] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states('timer.plug_' ~ repeat.item ~ '_min_on') not in ['active', 'paused'] and is_state('switch.ihoment_plug_' ~ repeat.item, 'on') }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ not is_state('input_boolean.plug_' ~ repeat.item ~ '_held_by_you', 'on') }}"
                  then:
                  - event: dump_control_switching
                    event_data:
                      sock: "{{ repeat.item }}"
                      state: "off"
                  - action: switch.turn_off
                    target:
                      entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                - action: timer.cancel
                  target:
                    entity_id: "timer.plug_{{ repeat.item }}_min_on"
                - action: timer.start
                  target:
                    entity_id: "timer.plug_{{ repeat.item }}_cooldown"
                - variables:
                    sock: "{{ repeat.item }}"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                    message: >-
                      {{ label }}: turned OFF by "Dump OFF Sungold charge sockets: pack recovered": Sungold {{ states('sensor.sungold-inverter-1_battery_voltage') }} V. Cooldown 10 min.

  - id: dump_inverter-1-charge_surplus_on
    alias: "Dump ON Sungold charge sockets: feeding bank has surplus"
    description: >
      Sungold charge is enabled, rescue is off, and Sungold volts are under the
      full helper. Turns on a socket whose Use is Sungold charge when the bank
      named by its Inverter helper is in float, solar is present, that bank is
      not at stop volts, its battery is within the discharge limit, and that
      battery is charging by at least the surplus watts helper. Waits the charge
      dwell. Skips the socket while it is on hold or in cooldown, and waits while
      the dump master is on and a dump socket is still next so small dumps stage
      first. Does not start the minimum on timer. Does not run while rescue is on,
      and does not switch dump sockets. Home Assistant start and a one minute poll
      re-check a surplus that is already true. Sends ON once and waits up to 3
      minutes for the plug to report on; no report raises a Plug did not switch
      notification. Skips held-by-you sockets.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.inverter-1-charge_surplus_ready
        to: "on"
        for:
          seconds: "{{ states('input_number.inverter-1-charge_dwell_s') | int(0) }}"
      - trigger: state
        entity_id:
          - sensor.battery_1_power
          - sensor.battery_2_power
          - sensor.sungold-inverter-1_battery_voltage
          - sensor.dump_next_plug
          - binary_sensor.dump_solar_present
          - binary_sensor.dump_v_float_t2
          - binary_sensor.dump_v_float_ku
          - binary_sensor.dump_v_rebulk_t2
          - binary_sensor.dump_v_rebulk_ku
          - binary_sensor.dump_batt_battery-2-ok
          - binary_sensor.dump_batt_battery-1-ok
          - binary_sensor.inverter-1-charge_need
          - input_boolean.dump_control_enabled
          - input_boolean.inverter-1-charge_enabled
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.inverter-1-charge_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.inverter-1-charge_need
        state: "off"
      - condition: state
        entity_id: binary_sensor.inverter-1-charge_surplus_ready
        state: "on"
        for:
          seconds: "{{ states('input_number.inverter-1-charge_dwell_s') | int(0) }}"
    actions:
      - variables:
          targets: >
            {% set defer = is_state('input_boolean.dump_control_enabled', 'on')
               and states('sensor.dump_next_plug').startswith('switch.ihoment_plug_') %}
            {% set ns = namespace(out=[]) %}
            {% if not defer %}
              {% for s in [
                'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
                'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
                'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
              ] %}
                {% set bus = states('input_select.plug_' ~ s ~ '_inverter') %}
                {% set rawp = states('sensor.battery_1_power') if bus == 'T2' else states('sensor.battery_2_power') %}
                {% set minw = states('input_number.inverter-1-charge_surplus_min_w') %}
                {% set rawv = states('sensor.sungold-inverter-1_battery_voltage') %}
                {% set full = states('input_number.inverter-1-charge_full_v') %}
                {% set bank = namespace(ok=false) %}
                {% if bus == 'T2' %}
                  {% set bank.ok = is_state('binary_sensor.dump_battery-2-charger_float', 'on')
                     and not is_state('binary_sensor.dump_v_rebulk_t2', 'on') %}
                {% elif bus == 'KU' %}
                  {% set bank.ok = is_state('binary_sensor.dump_battery-1-charger_float', 'on')
                     and not is_state('binary_sensor.dump_v_rebulk_ku', 'on') %}
                {% endif %}
                {% if not is_state('binary_sensor.inverter-1-charge_need', 'on')
                   and is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
                   and is_state('switch.ihoment_plug_' ~ s, 'off')
                   and states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused']
                   and is_state('timer.plug_' ~ s ~ '_cooldown', 'idle')
                   and bank.ok %}
                  {% set ns.out = ns.out + [s] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ is_state('switch.ihoment_plug_' ~ repeat.item, 'off') and states('timer.plug_' ~ repeat.item ~ '_hold') not in ['active', 'paused'] and is_state('timer.plug_' ~ repeat.item ~ '_cooldown', 'idle') and not is_state('binary_sensor.inverter-1-charge_need', 'on') and not is_state('input_boolean.plug_' ~ repeat.item ~ '_held_by_you', 'on') }}"
              then:
                - event: dump_control_switching
                  event_data:
                    sock: "{{ repeat.item }}"
                    state: "on"
                - action: switch.turn_on
                  target:
                    entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                - wait_template: "{{ is_state('switch.ihoment_plug_' ~ repeat.item, 'on') }}"
                  timeout: "00:03:00"
                  continue_on_timeout: true
                - variables:
                    sock: "{{ repeat.item }}"
                    switched: "{{ wait.completed }}"
                - *socket_label
                - if:
                    - condition: template
                      value_template: "{{ switched }}"
                  then:
                    - action: logbook.log
                      data:
                        name: Dump control
                        entity_id: "switch.ihoment_plug_{{ sock }}"
                        message: >-
                          {{ label }}: turned ON because {{ 'T2 and KU can feed cart loads from solar' if is_state('binary_sensor.inverter-1-charge_banks_feed', 'on') else 'the feeding bank has surplus' }}: Sungold {{ states('sensor.sungold-inverter-1_battery_voltage') }} V, T2 {{ states('sensor.battery_1_power') }} W, KU {{ states('sensor.battery_2_power') }} W.
                    - action: persistent_notification.dismiss
                      data:
                        notification_id: "plug_no_switch_{{ sock }}"
                  else:
                    - action: logbook.log
                      data:
                        name: Dump control
                        entity_id: "switch.ihoment_plug_{{ sock }}"
                        message: >-
                          {{ label }}: did not turn ON for "Dump ON Sungold charge sockets: feeding bank has surplus": the plug did not report on within 3 minutes. The next check tries again.
                    - action: persistent_notification.create
                      data:
                        title: Plug did not switch
                        message: >-
                          {{ label }} was told to turn ON (Sungold charge, feeding bank has surplus) and did not report on within
                          3 minutes. Check the plug and the Pi 4 bridge log. The next check tries again.
                        notification_id: "plug_no_switch_{{ sock }}"

  - id: dump_inverter-1-charge_surplus_off
    alias: "Dump OFF Sungold charge sockets: surplus ended"
    description: >
      Sungold charge is enabled and rescue is off. Turns off a Sungold charge
      socket when its feeding bank no longer meets the surplus checks, or when
      Sungold volts are no longer a number, after the charge dwell, once that
      socket's minimum on timer is idle. Reaching full volts is the pack-recovered
      rule, so this rule leaves that case alone. A held socket is skipped only
      while hold also blocks turn-offs. Starts the cooldown. Does not run while
      rescue is on, so solar gone and re-bulk do not shed a rescue charge.
      Home Assistant start and a one minute poll re-check a stop that is already true.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.inverter-1-charge_surplus_stop
        to: "on"
        for:
          seconds: "{{ states('input_number.inverter-1-charge_dwell_s') | int(0) }}"
      - trigger: state
        entity_id:
          - sensor.battery_1_power
          - sensor.battery_2_power
          - sensor.sungold-inverter-1_battery_voltage
          - binary_sensor.dump_solar_present
          - binary_sensor.dump_v_float_t2
          - binary_sensor.dump_v_float_ku
          - binary_sensor.dump_v_rebulk_t2
          - binary_sensor.dump_v_rebulk_ku
          - binary_sensor.dump_batt_battery-2-ok
          - binary_sensor.dump_batt_battery-1-ok
          - binary_sensor.inverter-1-charge_need
          - input_boolean.inverter-1-charge_enabled
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.inverter-1-charge_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.inverter-1-charge_need
        state: "off"
      - condition: state
        entity_id: binary_sensor.inverter-1-charge_surplus_stop
        state: "on"
        for:
          seconds: "{{ states('input_number.inverter-1-charge_dwell_s') | int(0) }}"
    actions:
      - variables:
          targets: >
            {% set rawv = states('sensor.sungold-inverter-1_battery_voltage') %}
            {% set full = states('input_number.inverter-1-charge_full_v') %}
            {% set at_full = is_number(rawv) and is_number(full) and (rawv | float) >= (full | float) %}
            {% set ns = namespace(out=[]) %}
            {% if not is_state('binary_sensor.inverter-1-charge_need', 'on') %}
              {% for s in [
                'plug-1_left', 'plug-1_right', 'plug-2_left', 'plug-2_right', 'plug-3_left', 'plug-3_right',
                'plug-4_left', 'plug-4_right', 'plug-5_left', 'plug-5_right', 'plug-6_left', 'plug-6_right',
                'plug-7_left', 'plug-7_right', 'plug-8_left', 'plug-8_right'
              ] %}
                {% set bus = states('input_select.plug_' ~ s ~ '_inverter') %}
                {% set rawp = states('sensor.battery_1_power') if bus == 'T2' else states('sensor.battery_2_power') %}
                {% set minw = states('input_number.inverter-1-charge_surplus_min_w') %}
                {% set bank = namespace(ok=false) %}
                {% if bus == 'T2' %}
                  {% set bank.ok = is_state('binary_sensor.dump_battery-2-charger_float', 'on')
                     and not is_state('binary_sensor.dump_v_rebulk_t2', 'on') %}
                {% elif bus == 'KU' %}
                  {% set bank.ok = is_state('binary_sensor.dump_battery-1-charger_float', 'on')
                     and not is_state('binary_sensor.dump_v_rebulk_ku', 'on') %}
                {% endif %}
                {% if is_state('input_select.plug_' ~ s ~ '_use', 'Sungold charge')
                   and (bus == 'T2' or bus == 'KU')
                   and is_state('switch.ihoment_plug_' ~ s, 'on')
                   and (states('timer.plug_' ~ s ~ '_hold') not in ['active', 'paused'] or not is_state('input_boolean.dump_hold_blocks_turn_off', 'on'))
                   and states('timer.plug_' ~ s ~ '_min_on') not in ['active', 'paused']
                   and not bank.ok %}
                  {% set ns.out = ns.out + [s] %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.out }}
      - repeat:
          for_each: "{{ targets }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ is_state('switch.ihoment_plug_' ~ repeat.item, 'on') and states('timer.plug_' ~ repeat.item ~ '_min_on') not in ['active', 'paused'] and not is_state('binary_sensor.inverter-1-charge_need', 'on') }}"
              then:
                - if:
                    - condition: template
                      value_template: "{{ not is_state('input_boolean.plug_' ~ repeat.item ~ '_held_by_you', 'on') }}"
                  then:
                  - event: dump_control_switching
                    event_data:
                      sock: "{{ repeat.item }}"
                      state: "off"
                  - action: switch.turn_off
                    target:
                      entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                - action: timer.cancel
                  target:
                    entity_id: "timer.plug_{{ repeat.item }}_min_on"
                - action: timer.start
                  target:
                    entity_id: "timer.plug_{{ repeat.item }}_cooldown"
                - variables:
                    sock: "{{ repeat.item }}"
                - *socket_label
                - action: logbook.log
                  data:
                    name: Dump control
                    entity_id: "switch.ihoment_plug_{{ repeat.item }}"
                    message: >-
                      {{ label }}: turned OFF by "Dump OFF Sungold charge sockets: surplus ended": Sungold {{ states('sensor.sungold-inverter-1_battery_voltage') }} V, T2 {{ states('sensor.battery_1_power') }} W, KU {{ states('sensor.battery_2_power') }} W. Cooldown 10 min.

  - id: dump_inverter-1-charge_source_stop
    alias: "Dump OFF Sungold charge sockets: feeding bank low"
    description: >
      Sungold charge is enabled and a feeding bank named by a socket's Inverter
      helper has stayed at or under that bank's re-bulk stop for the dwell helper.
      Turns that Sungold charge socket off even during the minimum on time, then
      starts its cooldown, so a sagging T2 or KU pack is not kept on the inlet.
      A held socket is skipped only while hold also blocks turn-offs. Does not
      switch sockets whose Use is dump. Home Assistant start and a one minute poll
      re-check a feeding bank that is already under stop volts.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.inverter-1-charge_source_stop
        to: "on"
        for:
          seconds: "{{ states('input_number.inverter-1-charge_dwell_s') | int(0) }}"
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.inverter-1-charge_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.inverter-1-charge_source_stop
        state: "on"
        for:
          seconds: "{{ states('input_number.inverter-1-charge_dwell_s') | int(0) }}"
    actions:
      - variables:
