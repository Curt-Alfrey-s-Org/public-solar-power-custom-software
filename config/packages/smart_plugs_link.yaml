# Per plug: which radios have a link problem with it (docs/plug_MULTI_BRIDGE.md,
# "Link health per radio"). Each bridge publishes sensor.ihoment_plug_<id>_link_<radio>.
# State is "ok" or a list such as "solar-broker connect timeout, monitor offline".
# last_ok_by is the radio whose last good command is the newest.

template:
  - sensor:
      - name: "Plug 1 link"
        unique_id: plug-1_link
        icon: mdi:bluetooth-connect
        state: >-
          {% set ns = namespace(bad=[]) %}{% for n in ['monitor', 'apps', 'solar-broker'] %}{% set s = states('sensor.plug-1_link_' ~ n) %}{% if s == 'unavailable' %}{% set ns.bad = ns.bad + [n ~ ' offline'] %}{% elif s not in ['ok', 'no_key', 'unknown', ''] %}{% set ns.bad = ns.bad + [n ~ ' ' ~ s | replace('_', ' ')] %}{% endif %}{% endfor %}{{ ns.bad | join(', ') if ns.bad else 'ok' }}
        attributes:
          last_ok_by: >-
            {% set ns = namespace(best='none', at=0) %}{% for n in ['monitor', 'apps', 'solar-broker'] %}{% set t = as_timestamp(state_attr('sensor.plug-1_link_' ~ n, 'last_ok'), 0) %}{% if t > ns.at %}{% set ns.at = t %}{% set ns.best = n %}{% endif %}{% endfor %}{{ ns.best }}
