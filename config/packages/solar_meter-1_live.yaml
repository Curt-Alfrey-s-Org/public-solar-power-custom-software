# Pass-through meter-1 A3/B3 with strict availability (no frozen watts when AC path is dead).
# Refoss native: unavailable when meter-1 UDP stops (MAX_ERRORS on coordinator).
# Wrappers: unavailable when channel V < 80 V, or Sungold UTI dead while meter-1 claims >5 W.
# Site solar tiles use sensor.meter-1_* ; Refoss dashboard keeps native entities.
# https://www.home-assistant.io/integrations/template/

template:
  - sensor:
      - name: Site meter-1 A3 power
        unique_id: meter-1_a3_power
        default_entity_id: sensor.meter-1_a3_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >-
          {% set v = states('sensor.meter-1_a3_voltage') %}
          {% set p = states('sensor.meter-1_a3_power') %}
          {% set sgv = states('sensor.sungold-inverter-1_grid_voltage') %}
          {% set sga = states('sensor.sungold-inverter-1_grid_current') %}
          {{ not is_state(v, 'unavailable') and not is_state(v, 'unknown')
             and not is_state(p, 'unavailable') and not is_state(p, 'unknown')
             and (v | float(0)) >= 80
             and not (is_number(sgv) and is_number(sga)
               and (sgv | float(0)) < 50 and (sga | float(0)) < 0.5
               and is_number(p) and ((p | float(0)) | abs) > 5) }}
        state: "{{ states('sensor.meter-1_a3_power') | float(0) }}"
